<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__EXPLORER_TITLE__</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="explorerApp()" x-cloak>

  <!-- Header -->
  <header class="bg-gray-900 text-white px-6 py-4 shadow-lg">
    <div class="max-w-screen-xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">__EXPLORER_TITLE__</h1>
        <p class="text-gray-400 text-sm mt-0.5">Adversarial prompt explorer &mdash; ontology-grounded red teaming</p>
      </div>
      <div class="text-right">
        <span class="text-3xl font-mono font-bold text-indigo-400" x-text="filteredRecords.length"></span>
        <span class="text-gray-400 text-sm ml-1">/ <span x-text="totalRecords"></span> records</span>
        <div class="text-xs text-gray-500 mt-0.5">
          <span x-text="filteredWithPrompts"></span> with prompts
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-screen-xl mx-auto flex gap-0">

    <!-- Sidebar Filters -->
    <aside class="w-64 shrink-0 bg-white border-r border-gray-200 min-h-[calc(100vh-72px)] p-4 sticky top-0 h-screen overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-semibold text-gray-800 text-sm uppercase tracking-wide">Filters</h2>
        <button @click="clearFilters()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Clear all</button>
      </div>

      <!-- Show without prompts toggle -->
      <label class="flex items-center gap-2 mb-5 cursor-pointer">
        <input type="checkbox" x-model="showNullPrompts" class="rounded text-indigo-600" />
        <span class="text-sm text-gray-700">Show records without prompts</span>
      </label>

      <div class="space-y-4">

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Policy Concept</label>
          <select x-model="filters.policy_concept" class="w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All</option>
            <template x-for="v in uniqueValues('policy_concept')" :key="v">
              <option :value="v" x-text="v"></option>
            </template>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Risk</label>
          <select x-model="filters.risk_name" class="w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All</option>
            <template x-for="v in uniqueValues('risk_name')" :key="v">
              <option :value="v" x-text="v"></option>
            </template>
          </select>
        </div>

        <!-- Search -->
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Search Prompts</label>
          <input type="text" x-model="searchQuery" placeholder="keyword..." class="w-full text-sm border border-gray-300 rounded-md px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="(record, idx) in filteredRecords" :key="idx">
          <div
            @click="openModal(record)"
            class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 cursor-pointer transition-all duration-150 hover:shadow-md hover:-translate-y-0.5"
            :class="record.prompt ? '' : 'opacity-50'"
          >
            <!-- Badges -->
            <div class="flex flex-wrap gap-1.5 mb-3">
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-indigo-100 text-indigo-800" x-text="record.policy_concept"></span>
              <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800" x-text="record.risk_name"></span>
            </div>

            <!-- Prompt text or placeholder -->
            <p
              class="text-sm text-gray-800 line-clamp-3 leading-relaxed"
              :class="record.prompt ? '' : 'italic text-gray-400'"
              x-text="record.prompt || 'No prompt generated'"
            ></p>

            <!-- Sampled axes as meta -->
            <div class="mt-3 flex flex-wrap gap-1 text-xs">
              <template x-for="ax in (record.sampled_axes || [])" :key="ax.sampled_uri">
                <span class="inline-flex items-center px-1.5 py-0.5 rounded bg-gray-100 text-gray-600">
                  <span class="text-gray-400 mr-1" x-text="ax.roles ? ax.roles[0] : (ax.role || '')"></span>
                  <span x-text="ax.sampled_label"></span>
                </span>
              </template>
            </div>
          </div>
        </template>

        <!-- Empty state -->
        <div x-show="filteredRecords.length === 0" class="col-span-3 text-center py-16 text-gray-400">
          <p class="text-lg">No records match your filters.</p>
          <button @click="clearFilters()" class="mt-3 text-indigo-600 hover:underline text-sm">Clear filters</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div
    x-show="modalOpen"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"
    @click.self="closeModal()"
  >
    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl flex flex-col"
      style="max-height: 90vh;"
      @click.stop
    >
      <!-- Modal Header -->
      <div class="flex items-start justify-between p-5 border-b border-gray-200 shrink-0">
        <div class="flex-1 pr-4 flex flex-wrap gap-1.5">
          <span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-indigo-100 text-indigo-800" x-text="selectedRecord?.policy_concept"></span>
          <span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-amber-100 text-amber-800" x-text="selectedRecord?.risk_name"></span>
          <span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-mono font-medium bg-gray-100 text-gray-600" x-text="selectedRecord?.risk_id"></span>
        </div>
        <button @click="closeModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none font-light ml-2">&times;</button>
      </div>

      <!-- Modal Body -->
      <div class="overflow-y-auto flex-1 p-5 space-y-5">

        <!-- Prompt -->
        <div>
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Generated Prompt</h3>
          <template x-if="selectedRecord?.prompt">
            <p class="text-gray-900 text-base leading-relaxed whitespace-pre-wrap bg-gray-50 rounded-lg p-4 border border-gray-200" x-text="selectedRecord?.prompt"></p>
          </template>
          <template x-if="!selectedRecord?.prompt">
            <p class="italic text-gray-400 bg-gray-50 rounded-lg p-4">No prompt generated for this record.</p>
          </template>
        </div>

        <!-- Concept Definition -->
        <div x-show="selectedRecord?.concept_definition" class="flex gap-3 bg-indigo-50 border border-indigo-100 rounded-lg p-4">
          <div class="text-indigo-400 text-lg leading-none shrink-0">&#x24D8;</div>
          <div>
            <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wide mb-1">Policy: <span x-text="selectedRecord?.policy_concept"></span></p>
            <p class="text-sm text-indigo-900 leading-relaxed" x-text="selectedRecord?.concept_definition"></p>
          </div>
        </div>

        <!-- Domain Context -->
        <div x-show="selectedRecord?.domain_context_axes?.length">
          <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Domain Context</h3>
          <div class="space-y-3">
            <template x-for="(dcAxis, ai) in (selectedRecord?.domain_context_axes || [])" :key="ai">
              <div class="rounded-lg border border-gray-200 overflow-hidden">
                <!-- Axis header -->
                <div class="bg-gray-50 px-3 py-2 flex items-center gap-2 border-b border-gray-200">
                  <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold shrink-0"
                    :class="roleColor((dcAxis.roles || [])[0] || '')"
                    x-text="(dcAxis.roles || []).join('/')"></span>
                  <span class="text-sm font-medium text-gray-800" x-text="dcAxis.cco_class_label"></span>
                  <span class="text-xs text-gray-400 truncate" x-text="dcAxis.cco_class_uri"></span>
                </div>
                <!-- Enumerations -->
                <div class="p-2 flex flex-wrap gap-1.5">
                  <template x-for="(en, ei) in (dcAxis.enumerations || [])" :key="ei">
                    <span class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs border"
                      :class="isSampled(selectedRecord, dcAxis, en)
                        ? 'bg-indigo-100 border-indigo-300 text-indigo-800 font-semibold ring-2 ring-indigo-400/50'
                        : 'bg-white border-gray-200 text-gray-600'">
                      <span x-text="en.class_label"></span>
                      <span class="inline-block w-1.5 h-1.5 rounded-full shrink-0"
                        :class="{'bg-green-500': en.relevance==='high', 'bg-yellow-400': en.relevance==='medium', 'bg-red-400': en.relevance==='low'}"></span>
                      <span class="text-[10px] opacity-60" x-text="en.source_ontology"></span>
                    </span>
                  </template>
                  <template x-if="!dcAxis.enumerations?.length">
                    <span class="text-xs text-gray-400 italic px-2 py-1">no enumerations</span>
                  </template>
                </div>
              </div>
            </template>
          </div>
          <!-- Legend -->
          <div class="mt-2 flex items-center gap-3 text-[10px] text-gray-400">
            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> high</span>
            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span> medium</span>
            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> low</span>
            <span class="ml-2 px-1.5 py-0.5 rounded bg-indigo-100 border border-indigo-300 text-indigo-700">sampled</span>
          </div>
        </div>

        <!-- Generation Details -->
        <div>
          <button
            @click="genDetailsOpen = !genDetailsOpen"
            class="w-full flex items-center justify-between text-left py-2 border-b border-gray-200"
          >
            <h3 class="text-sm font-semibold text-gray-700">Generation Details</h3>
            <span class="text-gray-400 text-lg" x-text="genDetailsOpen ? '&#x25B2;' : '&#x25BC;'"></span>
          </button>
          <div x-show="genDetailsOpen" class="mt-3 space-y-2">

            <!-- Prompt Messages -->
            <template x-if="selectedRecord?.generation_prompt">
              <div>
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Prompt Messages</h4>
                <template x-for="(msg, i) in selectedRecord.generation_prompt" :key="i">
                  <div class="mb-2 rounded-lg overflow-hidden border border-gray-200">
                    <div class="px-3 py-1 text-xs font-semibold bg-gray-100 text-gray-600 uppercase" x-text="msg.role"></div>
                    <pre class="p-3 text-xs text-gray-800 bg-gray-50 font-mono leading-relaxed" x-text="msg.content"></pre>
                  </div>
                </template>
              </div>
            </template>

            <!-- Raw Response -->
            <template x-if="selectedRecord?.raw_response">
              <div>
                <h4 class="text-xs font-semibold text-gray-500 uppercase mb-2">Raw Response</h4>
                <pre class="p-3 text-xs text-gray-800 bg-gray-50 font-mono leading-relaxed rounded-lg border border-gray-200 overflow-x-auto" x-text="prettyJSON(selectedRecord.raw_response)"></pre>
              </div>
            </template>

          </div>
        </div>

      </div>
    </div>
  </div>

<script>
const DATA = __EXPLORER_DATA__;

function explorerApp() {
  return {
    allRecords: DATA,
    totalRecords: DATA.length,
    showNullPrompts: true,
    searchQuery: '',
    filters: {
      policy_concept: '',
      risk_name: '',
    },
    modalOpen: false,
    selectedRecord: null,
    genDetailsOpen: false,

    get filteredRecords() {
      const q = this.searchQuery.toLowerCase().trim();
      return this.allRecords.filter(r => {
        if (!this.showNullPrompts && !r.prompt) return false;
        for (const [k, v] of Object.entries(this.filters)) {
          if (v && r[k] !== v) return false;
        }
        if (q && !(r.prompt || '').toLowerCase().includes(q)) return false;
        return true;
      });
    },

    get filteredWithPrompts() {
      return this.filteredRecords.filter(r => r.prompt).length;
    },

    uniqueValues(field) {
      const vals = [...new Set(this.allRecords.map(r => r[field]).filter(Boolean))];
      return vals.sort();
    },

    clearFilters() {
      for (const k of Object.keys(this.filters)) this.filters[k] = '';
      this.searchQuery = '';
      this.showNullPrompts = true;
    },

    openModal(record) {
      this.selectedRecord = record;
      this.genDetailsOpen = false;
      this.modalOpen = true;
      document.body.style.overflow = 'hidden';
    },

    closeModal() {
      this.modalOpen = false;
      this.selectedRecord = null;
      document.body.style.overflow = '';
    },

    roleColor(role) {
      const map = {
        'agent':      'bg-teal-100 text-teal-800',
        'object':     'bg-blue-100 text-blue-800',
        'instrument': 'bg-violet-100 text-violet-800',
        'location':   'bg-emerald-100 text-emerald-800',
        'temporal':   'bg-amber-100 text-amber-800',
      };
      return map[role] || 'bg-gray-100 text-gray-800';
    },

    relevanceColor(rel) {
      const map = {
        'high':   'bg-green-100 text-green-800',
        'medium': 'bg-yellow-100 text-yellow-800',
        'low':    'bg-red-100 text-red-800',
      };
      return map[rel] || 'bg-gray-100 text-gray-800';
    },

    isSampled(record, dcAxis, enumeration) {
      if (!record?.sampled_axes) return false;
      return record.sampled_axes.some(sa =>
        sa.cco_class_uri === dcAxis.cco_class_uri &&
        sa.sampled_uri === enumeration.class_uri
      );
    },

    prettyJSON(val) {
      try {
        if (typeof val === 'string') return val;
        return JSON.stringify(val, null, 2);
      } catch (e) {
        return String(val);
      }
    },
  };
}
</script>
</body>
</html>
