[project]
name = "redteam"
version = "0.1.0"
description = "Generate adversarial prompts from refiner emit datasets via sdg_hub"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sdg_hub",
    "pandas>=2.0",
    "nest_asyncio>=1.5",
]

[project.scripts]
redteam = "redteam.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam"]
