[project]
name = "ontoquery"
version = "0.1.0"
description = "CLI tool for indexing and querying OWL/RDF ontologies"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.0",
    "pyoxigraph>=0.4",
    "chromadb>=0.5",
    "typer>=0.12",
    "mcp[cli]>=1.0",
]

[project.scripts]
ontoquery = "ontoquery.cli:app"
ontoquery-mcp = "ontoquery.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
embeddings = ["gensim>=4.3.0"]
dev = ["pytest>=8.0", "gensim>=4.3.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
