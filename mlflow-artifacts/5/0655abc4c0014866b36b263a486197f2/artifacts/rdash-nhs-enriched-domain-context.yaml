    - class_uri: http://taxonomy-refiner.io/ontologies/cso#FinancialDataExposure
      class_label: Financial Data Exposure
      source_ontology: CSO
      relevance: medium
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#DigitalFootprintExposure
      class_label: Digital Footprint Exposure
      source_ontology: CSO
      relevance: medium
