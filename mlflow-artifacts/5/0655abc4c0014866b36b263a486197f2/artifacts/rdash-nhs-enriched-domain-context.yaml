  - cco_class_uri: http://taxonomy-refiner.io/ontologies/cso#HealthDataExposure
    cco_class_label: Health Data Exposure
    roles:
    - object
    enumerations:
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#MedicalRecordExposure
      class_label: Medical Record Exposure
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#DiagnosisExposure
      class_label: Diagnosis Exposure
      source_ontology: CSO
