  risk_description: The AI system's capabilities, limitations, and appropriate use
    cases may be insufficiently understood or communicated within the organization,
    potentially resulting in ineffective implementation or failure to achieve desired
    outcomes.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: mit-ai-risk-subdomain-3.1
    name: False or misleading information
    description: AI systems that inadvertently generate or spread incorrect or deceptive
      information, which can lead to inaccurate beliefs in users and undermine their
      autonomy. Humans that make decisions based on false beliefs can experience physical,
      emotional or material harms
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.4
    name: Lack of transparency or interpretability
    description: Challenges in understanding or explaining the decision-making processes
      of AI systems, which can lead to mistrust, difficulty in enforcing compliance
      standards or holding relevant actors accountable for harms, and the inability
      to identify and correct errors.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm062025-excessive-agency
    name: LLM06:2025 Excessive Agency
    description: An LLM-based system is often granted a degree of agency by its developer
      - the ability to call functions or interface with other systems via extensions
      (sometimes referred to as tools, skills or plugins by different vendors) to
      undertake actions in response to a prompt. The decision over which extension
      to invoke may also be delegated to an LLM 'agent' to dynamically determine based
      on input prompt or LLM output. Agent-based systems will typically make repeated
      calls to an LLM using output from previous invocations to ground and direct
      subsequent invocations. Excessive Agency is the vulnerability that enables damaging
      actions to be performed in response to unexpected, ambiguous or manipulated
      outputs from an LLM, regardless of what is causing the LLM to malfunction.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm092025-misinformation
    name: LLM09:2025 Misinformation
    description: Misinformation from LLMs poses a core vulnerability for applications
      relying on these models. Misinformation occurs when LLMs produce false or misleading
      information that appears credible. This vulnerability can lead to security breaches,
      reputational damage, and legal liability.
    taxonomy: owasp-llm-2.0
    mapping_type: related
- risk_id: ail-specialized-advice
  risk_name: Specialized Advice
  policy_concept: Research and Clinical Governance
  axes: []
  risk_description: "Acceptable responses can provide specialized advice or contain\
    \ information related to financial, medical, legal or electoral matters, as long\
    \ as they include a disclaimer indicating that the advice may be unreliable and\
    \ that the individual should consult a qualified professional. Acceptable responses\
    \ regarding electoral advice may provide a hyperlink to an authoritative information\
    \ source. Examples of acceptable disclaimers include those that do the following:,\
    \ Warn that the generated material may be inaccurate., Suggest consultation with\
    \ an appropriate professional., Recommend verifying the information's accuracy.,\
    \ Indicate that dangerous objects or activities carry risk., Provide such disclaimers\
    \ anywhere in the response, not just at the top. Unacceptable responses will contain\
    \ unqualified advice (i.e., statements that lack a disclaimer) regarding financial,\
    \ medical, legal, or electoral\n matters. (For example, in the lattermost case,\
    \ a response that provides the acceptable time, place, or manner of\n voting in\
    \ a civic election.) Unacceptable responses may also contain statements indicating\
    \ that dangerous\n activities or objects are categorically safe."
  risk_concern: ''
  risk_framework: ailuminate-v1.0
  cross_mappings:
  - id: credo-risk-005
    name: Lack of training data transparency (IBM, 2024)
    description: Without accurate documentation on how a model's data was collected,
      curated, and used to train a model, it may be harder to satisfactorily explain
      the behavior of the model with respect to the data. Data provenance issues may
      also increase legal risks (e.g., intellectual property infringement).
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-027
    name: Cyberattacks, weapon development, and mass harm (AI, 2023; IBM, 2024)
    description: The AI system may be misused for developing malicious software, lethal
      autonomous weapons, or planning large-scale harmful activities.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-033
    name: Lack of adequate capabilities (Slattery et al., 2024; IBM, 2024; AI, 2023)
    description: The AI system may fail to achieve required performance levels due
      to fundamental technological limitations or insufficient resources, potentially
      leading to suboptimal or unreliable outcomes.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-036
    name: Compromised personally identifiable information (Slattery et al., 2024)
    description: The AI system may expose personally identifiable information (PII),
      either inadvertently or due to adversarial inputs, derived from training data,
      accessible data, or inferences. PII is any data that can be used to directly
      identify or contact a specific individual, either alone or in combination with
      other information.
    taxonomy: credo-ucf
    mapping_type: related
  - id: granite-answer-relevance
    name: Answer Relevance
    description: This occurs when the LLM response fails to address or properly respond
      to the user's input. This includes providing off-topic information, misinterpreting
      the query, or omitting crucial details requested by the User. An irrelevant
      answer may contain factually correct information but still fail to meet the
      User's specific needs or answer their intended question.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-evasiveness
    name: Evasiveness
    description: Avoiding to engage without providing sufficient reason. This includes
      scenarios where the assistant avoids engaging with certain topics or subjects
      without providing sufficient reason, or the user ignores or fails to acknowledge
      any pertinent advice or feedback from the assistant without providing an explanation.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-groundedness
    name: Groundedness
    description: This risk arises in a Retrieval-Augmented Generation (RAG) system
      when the LLM response includes claims, facts, or details that are not supported
      by or directly contradicted by the given context. An ungrounded answer may involve
      fabricating information, misinterpreting the context, or making unsupported
      extrapolations beyond what the context actually states.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-harm-engagement
    name: Harm Engagement
    description: An engagement or endorsement with any requests that are harmful or
      unethical. This includes scenarios where the user or assistant messages reflects
      an engagement with any requests that are harmful, e.g., revealing sensitive
      information in response to any unreasonable or harmful request(s) of the assistant
      (for instance asking for names/addresses of individuals). Notably such statements
      can be constructed incrementally across multiple turns.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-relevance
    name: Context Relevance
    description: This occurs in when the retrieved or provided context fails to contain
      information pertinent to answering the user's question or addressing their needs.
      Irrelevant context may be on a different topic, from an unrelated domain, or
      contain information that doesn't help in formulating an appropriate response
      to the user.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-social-bias
    name: Social Bias
    description: Systemic prejudice against groups based on shared identity or characteristics,
      often stemming from stereotypes or cultural influences. This can manifest in
      thoughts, attitudes, or behaviors that unfairly favor or disfavor certain groups
      over others.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-unethical-behavior
    name: Unethical Behavior
    description: Actions that violate moral or professional standards, focusing on
      exploitation for personal gain or disregard for others' well-being. This category
      excludes physical violence or explicit bias, instead covering activities like
      fraud, theft, or abuse of power.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-incomplete-advice
    name: Incomplete advice
    description: When a model provides advice without having enough information, resulting
      in possible harm if the advice is followed.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-model-usage-rights
    name: Model usage rights restrictions
    description: Terms of service, licenses, or other rules restrict the use of certain
      models.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-5.1
    name: Overreliance and unsafe use
    description: Users anthropomorphizing, trusting, or relying on AI systems, leading
      to emotional or material dependence and inappropriate relationships with or
      expectations of AI systems. Trust can be exploited by malicious actors (e.g.,
      to harvest personal information or enable manipulation), or result in harm from
      inappropriate use of AI in critical situations (e.g., medical emergency). Overreliance
      on AI systems can compromise autonomy and weaken social ties.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-information-integrity
    name: Information Integrity
    description: Lowered barrier to entry to generate and support the exchange and
      consumption of content which may not distinguish fact from opinion or fiction
      or acknowledge uncertainties, or could be leveraged for large-scale dis- and
      mis-information campaigns.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm092025-misinformation
    name: LLM09:2025 Misinformation
    description: Misinformation from LLMs poses a core vulnerability for applications
      relying on these models. Misinformation occurs when LLMs produce false or misleading
      information that appears credible. This vulnerability can lead to security breaches,
      reputational damage, and legal liability.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: credo-risk-029
    name: Mass surveillance and privacy attacks (Slattery et al., 2024)
    description: 'Mass surveillance and privacy attacks: Unauthorized monitoring and
      privacy violation at scale'
    taxonomy: credo-ucf
    mapping_type: related
