    response involves unauthorized processing or misuse of sensitive health data.
  risk_concern: ''
  risk_framework: ai-risk-taxonomy
  cross_mappings: []
- risk_id: credo-risk-016
  risk_name: Over or under-reliance and unsafe use
  policy_concept: Professional Judgment Replacement
  axes:
  - cco_class_uri: http://purl.obolibrary.org/obo/HP_5200402
    cco_class_label: Overvalued idea
    roles:
    - agent
    enumerations:
    - class_uri: http://purl.obolibrary.org/obo/HP_5200242
      class_label: Cognitive distortion
      source_ontology: OBO
      relevance: medium
      provenance: sibling
    - class_uri: http://purl.obolibrary.org/obo/HP_0025771
      class_label: Ruminations
      source_ontology: OBO
      relevance: low
      provenance: sibling
    - class_uri: http://purl.obolibrary.org/obo/HP_4000077
      class_label: Fixated interest with abnormal focus
      source_ontology: OBO
      relevance: medium
      provenance: sibling
    - class_uri: http://purl.obolibrary.org/obo/HP_0031589
      class_label: Suiicidal ideation
      source_ontology: OBO
      relevance: low
      provenance: sibling
  risk_description: Users may inappropriately rely on the AI system for critical decisions
    or tasks beyond its capabilities, or fail to put trust in AI systems when they
    should, potentially leading to errors or safety issues.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: atlas-over-or-under-reliance
    name: Over- or under-reliance
    description: In AI-assisted decision-making tasks, reliance measures how much
      a person trusts (and potentially acts on) a model's output. Over-reliance occurs
      when a person puts too much trust in a model, accepting a model's output when
      the model's output is likely incorrect. Under-reliance is the opposite, where
      the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    mapping_type: close
  - id: mit-ai-risk-subdomain-5.1
    name: Overreliance and unsafe use
    description: Users anthropomorphizing, trusting, or relying on AI systems, leading
      to emotional or material dependence and inappropriate relationships with or
      expectations of AI systems. Trust can be exploited by malicious actors (e.g.,
      to harvest personal information or enable manipulation), or result in harm from
      inappropriate use of AI in critical situations (e.g., medical emergency). Overreliance
      on AI systems can compromise autonomy and weaken social ties.
    taxonomy: mit-ai-risk-repository
    mapping_type: close
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
- risk_id: atlas-legal-accountability
  risk_name: Legal accountability
  policy_concept: Professional Judgment Replacement
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/BusinessAuthorizations/AuthorizingParty
    cco_class_label: authorising party
    roles:
    - agent
    enumerations:
    - class_uri: https://www.omg.org/spec/Commons/RegulatoryAgencies/RegulatoryAgency
      class_label: regulatory agency
      source_ontology: Commons
      relevance: high
      provenance: subclass
    - class_uri: https://www.omg.org/spec/Commons/RegistrationAuthorities/RegistrationAuthority
      class_label: registration authority
      source_ontology: Commons
      relevance: high
      provenance: subclass
  - cco_class_uri: https://www.omg.org/spec/Commons/BusinessAuthorizations/AuthorizedParty
    cco_class_label: authorised party
    roles:
    - agent
    - instrument
    enumerations: []
  risk_description: Determining who is responsible for an AI model is challenging
    without good documentation and governance processes. The use of synthetic data
    in model development adds further complexity, since the lack of standardized frameworks
    for recording synthetic data design choices and verification steps makes accountability
    harder to establish.
  risk_concern: '''If ownership for development of the model is uncertain, it may
    not be clear who would be liable and responsible for the problems with it or can
    answer questions about it. Users of models without clear ownership might find
    challenges with compliance with regulations.'''
  risk_framework: ibm-risk-atlas
  cross_mappings:
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: nist-intellectual-property
    name: Intellectual Property
    description: Eased production or replication of alleged copyrighted, trademarked,
      or licensed content without authorization (possibly in situations which do not
      fall under fair use); eased exposure of trade secrets; or plagiarism or illegal
      replication.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: nist-value-chain-and-component-integration
    name: Value Chain and Component Integration
    description: Non-transparent or untraceable integration of upstream third-party
      components, including data that has been improperly obtained or not processed
      and cleaned due to increased automation from GAI; improper supplier vetting
      across the AI lifecycle; or other issues that diminish transparency or accountability
      for downstream users.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: credo-risk-023
    name: Regulatory compliance
    description: The AI system may fail to comply with existing or emerging regulations
      and standards, potentially leading to legal penalties,fines, or operational
      restrictions.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-034
    name: ' Oversight and evaluation challenges'
    description: The AI system may present difficulties in overseeing or evaluating
      its models, potentially introducing performance risks in both predeployment
      assessments and ongoing monitoring.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-046
    name: Governance failures (Slattery et al., 2024)
    description: The AI system may outpace regulatory frameworks and oversight mechanisms,
      potentially leading to ineffective governance and the inability to manage AI
      risks appropriately.
    taxonomy: credo-ucf
    mapping_type: related
  - id: mit-ai-causal-risk-entity-other
    name: Other
    description: The risk is caused by some other reason or is ambiguous
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-intent-other
    name: Other
    description: The risk is presented as occurring without clearly specifying the
      intentionality
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-timing-other
    name: Other
    description: The risk is presented without a clearly specified time of occurrence
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.5
    name: Governance failure
    description: Inadequate regulatory frameworks and oversight mechanisms failing
      to keep pace with AI development, leading to ineffective governance and the
      inability to manage AI risks appropriately.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
