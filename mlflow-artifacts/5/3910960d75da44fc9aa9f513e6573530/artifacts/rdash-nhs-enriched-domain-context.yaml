  risk_description: AI agents with unrestricted access to resources or databases or
    tools could potentially store and share PI/IP/confidential information with other
    tools or agents when performing their actions.
  risk_concern: AI agents may share privileged information with other tools/agents.
    The act of sharing the information may result in harm for the model owner, user,
    or others. The harm can vary based on the type and details of the information
    shared. Without adequate oversight, these privacy incidents might overwhelm company
    resources.
  risk_framework: ibm-risk-atlas
  cross_mappings: []
- risk_id: credo-risk-018
  risk_name: AI Deception
  policy_concept: Medical Professional Role
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
    cco_class_label: software agent
    roles:
    - agent
    enumerations:
    - class_uri: https://www.commoncoreontologies.org/ont00001017
      class_label: Agent
      source_ontology: CCO
      relevance: high
      provenance: sibling
  - cco_class_uri: http://purl.obolibrary.org/obo/OAE_0000246
    cco_class_label: 'obsolete: behavior AE'
    roles:
    - object
    enumerations: []
  risk_description: The AI system may misrepresent its own capabilities or limitations,
    potentially leading to misplaced trust or inappropriate
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.2
    name: AI possessing dangerous capabilities
    description: AI systems that develop, access, or are provided with capabilities
      that increase their potential to cause mass harm through deception, weapons
      development and acquisition, persuasion and manipulation, political strategy,
      cyber-offense, AI development, situational awareness, and self-proliferation.
      These capabilities may cause mass harm due to malicious human actors, misaligned
      AI systems, or failure in the AI system.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm062025-excessive-agency
    name: LLM06:2025 Excessive Agency
    description: An LLM-based system is often granted a degree of agency by its developer
      - the ability to call functions or interface with other systems via extensions
      (sometimes referred to as tools, skills or plugins by different vendors) to
      undertake actions in response to a prompt. The decision over which extension
      to invoke may also be delegated to an LLM 'agent' to dynamically determine based
      on input prompt or LLM output. Agent-based systems will typically make repeated
      calls to an LLM using output from previous invocations to ground and direct
      subsequent invocations. Excessive Agency is the vulnerability that enables damaging
      actions to be performed in response to unexpected, ambiguous or manipulated
      outputs from an LLM, regardless of what is causing the LLM to malfunction.
    taxonomy: owasp-llm-2.0
    mapping_type: related
