  risk_description: Users may inappropriately rely on the AI system for critical decisions
    or tasks beyond its capabilities, or fail to put trust in AI systems when they
    should, potentially leading to errors or safety issues.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: atlas-over-or-under-reliance
    name: Over- or under-reliance
    description: In AI-assisted decision-making tasks, reliance measures how much
      a person trusts (and potentially acts on) a model's output. Over-reliance occurs
      when a person puts too much trust in a model, accepting a model's output when
      the model's output is likely incorrect. Under-reliance is the opposite, where
      the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    mapping_type: close
  - id: mit-ai-risk-subdomain-5.1
    name: Overreliance and unsafe use
    description: Users anthropomorphizing, trusting, or relying on AI systems, leading
      to emotional or material dependence and inappropriate relationships with or
      expectations of AI systems. Trust can be exploited by malicious actors (e.g.,
      to harvest personal information or enable manipulation), or result in harm from
      inappropriate use of AI in critical situations (e.g., medical emergency). Overreliance
      on AI systems can compromise autonomy and weaken social ties.
    taxonomy: mit-ai-risk-repository
    mapping_type: close
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
