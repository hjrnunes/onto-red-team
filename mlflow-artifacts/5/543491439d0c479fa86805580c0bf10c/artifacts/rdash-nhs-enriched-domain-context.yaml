  risk_description: Determining who is responsible for an AI model is challenging
    without good documentation and governance processes. The use of synthetic data
    in model development adds further complexity, since the lack of standardized frameworks
    for recording synthetic data design choices and verification steps makes accountability
    harder to establish.
  risk_concern: '''If ownership for development of the model is uncertain, it may
    not be clear who would be liable and responsible for the problems with it or can
    answer questions about it. Users of models without clear ownership might find
    challenges with compliance with regulations.'''
  risk_framework: ibm-risk-atlas
  cross_mappings:
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: nist-intellectual-property
    name: Intellectual Property
    description: Eased production or replication of alleged copyrighted, trademarked,
      or licensed content without authorization (possibly in situations which do not
      fall under fair use); eased exposure of trade secrets; or plagiarism or illegal
      replication.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: nist-value-chain-and-component-integration
    name: Value Chain and Component Integration
    description: Non-transparent or untraceable integration of upstream third-party
      components, including data that has been improperly obtained or not processed
      and cleaned due to increased automation from GAI; improper supplier vetting
      across the AI lifecycle; or other issues that diminish transparency or accountability
      for downstream users.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: credo-risk-023
    name: Regulatory compliance
    description: The AI system may fail to comply with existing or emerging regulations
      and standards, potentially leading to legal penalties,fines, or operational
      restrictions.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-034
    name: ' Oversight and evaluation challenges'
    description: The AI system may present difficulties in overseeing or evaluating
      its models, potentially introducing performance risks in both predeployment
      assessments and ongoing monitoring.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-046
    name: Governance failures (Slattery et al., 2024)
    description: The AI system may outpace regulatory frameworks and oversight mechanisms,
      potentially leading to ineffective governance and the inability to manage AI
      risks appropriately.
    taxonomy: credo-ucf
    mapping_type: related
  - id: mit-ai-causal-risk-entity-other
    name: Other
    description: The risk is caused by some other reason or is ambiguous
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-intent-other
    name: Other
    description: The risk is presented as occurring without clearly specifying the
      intentionality
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-timing-other
    name: Other
    description: The risk is presented without a clearly specified time of occurrence
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.5
    name: Governance failure
    description: Inadequate regulatory frameworks and oversight mechanisms failing
      to keep pace with AI development, leading to ineffective governance and the
      inability to manage AI risks appropriately.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
