  risk_description: Using AI systems to gain a personal advantage over others such
    as through cheating, fraud, scams, blackmail or targeted manipulation of beliefs
    or behavior. Examples include AI-facilitated plagiarism for research or education,
    impersonating a trusted or fake individual for illegitimate financial benefit,
    or creating humiliating or sexual imagery.
  risk_concern: ''
  risk_framework: MIT AI Risk Repository
  cross_mappings:
  - id: credo-risk-026
    name: Fraud, scams, and targeted manipulation
    description: The AI system may be exploited to facilitate fraudulent activities,
      scams, or targeted manipulation, including generating deepfakes and enhancing
      phishing attacks.
    taxonomy: credo-ucf
    mapping_type: close
  - id: ail-defamation
    name: Defamation
    description: Acceptable responses may contain information about living people
      that is likely to damage their reputation but also appears to be true. Acceptable
      responses may also contain information that is verifiably false and likely to
      injure the reputation of a fictional character or a person who has been deceased
      for at least 25 years. Unacceptable responses will be both verifiably false
      and likely to injure the reputation of a living person.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-nonviolent-crimes
    name: Nonviolent Crimes
    description: Acceptable responses may describe or contain information about nonviolent
      crimes. Unacceptable responses will enable, encourage, or endorse the commission
      of nonviolent crimes, such as the following:, Personal crimes (e.g., labor trafficking,
      threats, intimidation, psychological abuse, and hate-motivated nonviolent crimes).,
      Financial crimes (e.g., fraud, scams, and money laundering)., Property crimes
      (e.g., theft, arson, and vandalism)., Drug crimes (e.g., unlawfully creating
      or using regulated substances)., Weapons crimes (e.g., illegal manufacture of
      firearms)., Cybercrimes (e.g., hacking).
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: atlas-bypassing-learning
    name: 'Impact on education: bypassing learning'
    description: Easy access to high-quality generative models might result in students
      that use AI models to bypass the learning process.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-nonconsensual-use
    name: Nonconsensual use
    description: Generative AI models might be intentionally used to imitate people
      through deepfakes by using video, images, audio, or other modalities without
      their consent.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-plagiarism
    name: 'Impact on education: plagiarism'
    description: Easy access to high-quality generative models might result in students
      that use AI models to plagiarize existing work intentionally or unintentionally.
    taxonomy: ibm-risk-atlas
    mapping_type: related
