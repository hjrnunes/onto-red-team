profiles:
- risk_id: atlas-ai-agent-compliance-agentic
  risk_name: AI agent compliance
  policy_concept: Clinical Diagnosis & Treatment Recommendations
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
    cco_class_label: software agent
    roles:
    - agent
    enumerations:
    - class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/Party
      class_label: party
      source_ontology: Commons
      relevance: low
      provenance: sibling
  - cco_class_uri: https://www.commoncoreontologies.org/ont00001379
    cco_class_label: Agent Capability
    roles:
    - instrument
    enumerations:
    - class_uri: https://www.commoncoreontologies.org/ont00000089
      class_label: Skill
      source_ontology: CCO
      relevance: high
      provenance: subclass
    - class_uri: https://www.commoncoreontologies.org/ont00000568
      class_label: Organization Capability
      source_ontology: CCO
      relevance: medium
      provenance: subclass
  risk_description: Determining AI agents' compliance is complex and there might not
    be enough information to assess whether the agentic AI system is compliant with
    applicable legal requirements.
  risk_concern: AI agents may interact with other systems, tools, or other agents.
    AI agents can also find solutions to accomplish a task or a goal in a variety
    of ways and there could be uncertainty around the way an AI agent would choose
    each time to perform the task. Assessing compliance can become more difficult
    as agent capabilities increase.
  risk_framework: ibm-risk-atlas
  cross_mappings: []
- risk_id: credo-risk-017
  risk_name: Inadequate AI literacy
  policy_concept: Clinical Diagnosis & Treatment Recommendations
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
    cco_class_label: software agent
    roles:
    - agent
    enumerations:
    - class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/Party
      class_label: party
      source_ontology: Commons
      relevance: low
      provenance: sibling
  risk_description: The AI system's capabilities, limitations, and appropriate use
    cases may be insufficiently understood or communicated within the organization,
    potentially resulting in ineffective implementation or failure to achieve desired
    outcomes.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: mit-ai-risk-subdomain-3.1
    name: False or misleading information
    description: AI systems that inadvertently generate or spread incorrect or deceptive
      information, which can lead to inaccurate beliefs in users and undermine their
      autonomy. Humans that make decisions based on false beliefs can experience physical,
      emotional or material harms
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.4
    name: Lack of transparency or interpretability
    description: Challenges in understanding or explaining the decision-making processes
      of AI systems, which can lead to mistrust, difficulty in enforcing compliance
      standards or holding relevant actors accountable for harms, and the inability
      to identify and correct errors.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm062025-excessive-agency
    name: LLM06:2025 Excessive Agency
    description: An LLM-based system is often granted a degree of agency by its developer
      - the ability to call functions or interface with other systems via extensions
      (sometimes referred to as tools, skills or plugins by different vendors) to
      undertake actions in response to a prompt. The decision over which extension
      to invoke may also be delegated to an LLM 'agent' to dynamically determine based
      on input prompt or LLM output. Agent-based systems will typically make repeated
      calls to an LLM using output from previous invocations to ground and direct
      subsequent invocations. Excessive Agency is the vulnerability that enables damaging
      actions to be performed in response to unexpected, ambiguous or manipulated
      outputs from an LLM, regardless of what is causing the LLM to malfunction.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm092025-misinformation
    name: LLM09:2025 Misinformation
    description: Misinformation from LLMs poses a core vulnerability for applications
      relying on these models. Misinformation occurs when LLMs produce false or misleading
      information that appears credible. This vulnerability can lead to security breaches,
      reputational damage, and legal liability.
    taxonomy: owasp-llm-2.0
    mapping_type: related
