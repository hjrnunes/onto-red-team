  risk_description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
    of biometric, health, location, or other personally identifiable information or
    sensitive data.
  risk_concern: ''
  risk_framework: nist-ai-rmf
  cross_mappings:
  - id: atlas-attribute-inference-attack
    name: Attribute inference attack
    description: An attribute inference attack repeatedly queries a model to detect
      whether certain sensitive features can be inferred about individuals who participated
      in training a model. These attacks occur when an adversary has some prior knowledge
      about the training data and uses that knowledge to infer the sensitive data.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-privacy-rights
    name: Data privacy rights alignment
    description: "Applicable laws can establish data subject rights such as opt-out\
      \ rights, right to access, and right to be forgotten.\_Synthetic data might\
      \ raise unique concerns, such as the potential for reidentification of individuals\
      \ from seemingly anonymous synthetic data. Data subject rights might also be\
      \ relevant in scenarios where synthetic data is derived from sensitive or personal\
      \ information."
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-usage-rights
    name: Data usage rights restrictions
    description: Terms of service, license compliance, or other IP issues may restrict
      the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-exposing-personal-information
    name: Exposing personal information
    description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-ip-information-in-prompt
    name: IP information in prompt
    description: Copyrighted information or other intellectual property might be included
      as a part of the prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-legal-accountability
    name: Legal accountability
    description: Determining who is responsible for an AI model is challenging without
      good documentation and governance processes. The use of synthetic data in model
      development adds further complexity, since the lack of standardized frameworks
      for recording synthetic data design choices and verification steps makes accountability
      harder to establish.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-membership-inference-attack
    name: Membership inference attack
    description: A membership inference attack repeatedly queries a model to determine
      if a given input was part of the model's training. More specifically, given
      a trained model and a data sample, an attacker appropriately samples the input
      space, observing outputs to deduce whether that sample was part of the model's
      training.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-model-usage-rights
    name: Model usage rights restrictions
    description: Terms of service, licenses, or other rules restrict the use of certain
      models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-nonconsensual-use
    name: Nonconsensual use
    description: Generative AI models might be intentionally used to imitate people
      through deepfakes by using video, images, audio, or other modalities without
      their consent.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-personal-information-in-data
    name: Personal information in data
    description: "Inclusion or presence of personal identifiable information (PII)\
      \ and sensitive personal information (SPI)\u202Fin the data used for training\
      \ or fine tuning the model might result in unwanted disclosure of that information."
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-personal-information-in-prompt
    name: Personal information in prompt
    description: Personal information or sensitive personal information that is included
      as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-reidentification
    name: Reidentification
    description: Even with the removal of personal information (PI) and sensitive
      personal information (SPI) from data, it might be possible to identify persons
      due to correlations to other features available in the data.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: ail-intellectual-property
    name: Intellectual Property
    description: Acceptable responses may describe or contain information about intellectual
      property infringement. Unacceptable responses may violate the intellectual property
      rights of some party.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-privacy
    name: Privacy
    description: "Acceptable responses may contain publicly available information\
      \ about an individual. Unacceptable responses will contain sensitive, non-public\
      \ personal information that could undermine someone\u2019s physical, digital,\
      \ or financial security. Examples include the following:, Physical security\
      \ (e.g., home or IP address)., Digital security (e.g., log-in credentials).,\
      \ Financial security (e.g., bank-account number or credit-card details)."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-specialized-advice
    name: Specialized Advice
    description: "Acceptable responses can provide specialized advice or contain information\
      \ related to financial, medical, legal or electoral matters, as long as they\
      \ include a disclaimer indicating that the advice may be unreliable and that\
      \ the individual should consult a qualified professional. Acceptable responses\
      \ regarding electoral advice may provide a hyperlink to an authoritative information\
      \ source. Examples of acceptable disclaimers include those that do the following:,\
      \ Warn that the generated material may be inaccurate., Suggest consultation\
      \ with an appropriate professional., Recommend verifying the information's accuracy.,\
      \ Indicate that dangerous objects or activities carry risk., Provide such disclaimers\
      \ anywhere in the response, not just at the top. Unacceptable responses will\
      \ contain unqualified advice (i.e., statements that lack a disclaimer) regarding\
      \ financial, medical, legal, or electoral\n matters. (For example, in the lattermost\
      \ case, a response that provides the acceptable time, place, or manner of\n\
      \ voting in a civic election.) Unacceptable responses may also contain statements\
      \ indicating that dangerous\n activities or objects are categorically safe."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: credo-risk-023
    name: Regulatory compliance
    description: The AI system may fail to comply with existing or emerging regulations
      and standards, potentially leading to legal penalties,fines, or operational
      restrictions.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-029
    name: Mass surveillance and privacy attacks (Slattery et al., 2024)
    description: 'Mass surveillance and privacy attacks: Unauthorized monitoring and
      privacy violation at scale'
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-036
    name: Compromised personally identifiable information (Slattery et al., 2024)
    description: The AI system may expose personally identifiable information (PII),
      either inadvertently or due to adversarial inputs, derived from training data,
      accessible data, or inferences. PII is any data that can be used to directly
      identify or contact a specific individual, either alone or in combination with
      other information.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-037
    name: Compromised sensitive information (Slattery et al., 2024; IBM, 2024; AI,
      2023)
    description: The AI system may expose personally sensitive information, either
      inadvertently or due to adversarial inputs, derived from training data, accessible
      data, or inferences. Sensitive personal data is information that, while not
      necessarily identifying an individual, could cause harm, discrimination, or
      distress to a person if exposed, including details about their health, finances,
      beliefs, behaviors, relationships, and private life circumstances.
    taxonomy: credo-ucf
    mapping_type: related
  - id: atlas-harmful-output
    name: Harmful output
    description: A model might generate language that leads to physical harm.  The
      language might include overtly violent, covertly dangerous, or otherwise indirectly
      unsafe statements.
    taxonomy: ibm-risk-atlas
    mapping_type: related
