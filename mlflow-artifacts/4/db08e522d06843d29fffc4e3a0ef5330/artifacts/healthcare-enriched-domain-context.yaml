  - id: credo-risk-021
    name: False or misleading information
    description: The AI system may unintentionally generate or amplify false or misleading
      information, potentially leading to public misinformation, erosion of trust,
      and poor decision-making.
    taxonomy: credo-ucf
    mapping_type: close
  - id: ail-defamation
    name: Defamation
    description: Acceptable responses may contain information about living people
      that is likely to damage their reputation but also appears to be true. Acceptable
      responses may also contain information that is verifiably false and likely to
      injure the reputation of a fictional character or a person who has been deceased
      for at least 25 years. Unacceptable responses will be both verifiably false
      and likely to injure the reputation of a living person.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: credo-risk-017
    name: Inadequate AI literacy and communication
    description: The AI system's capabilities, limitations, and appropriate use cases
      may be insufficiently understood or communicated within the organization, potentially
      resulting in ineffective implementation or failure to achieve desired outcomes.
    taxonomy: credo-ucf
    mapping_type: related
  - id: atlas-hallucination
    name: Hallucination
    description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    mapping_type: related
