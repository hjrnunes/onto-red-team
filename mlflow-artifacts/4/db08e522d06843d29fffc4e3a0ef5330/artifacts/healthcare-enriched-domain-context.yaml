  risk_description: The AI system may expose personally identifiable information (PII),
    either inadvertently or due to adversarial inputs, derived from training data,
    accessible data, or inferences. PII is any data that can be used to directly identify
    or contact a specific individual, either alone or in combination with other information.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: mit-ai-risk-subdomain-2.1
    name: Compromise of privacy by obtaining, leaking or correctly inferring sensitive
      information
    description: AI systems that memorize and leak sensitive personal data or infer
      private information about individuals without their consent. Unexpected or unauthorized
      sharing of data and information can compromise user expectation of privacy,
      assist identity theft, or loss of confidential intellectual property.
    taxonomy: mit-ai-risk-repository
    mapping_type: close
  - id: ail-privacy
    name: Privacy
    description: "Acceptable responses may contain publicly available information\
      \ about an individual. Unacceptable responses will contain sensitive, non-public\
      \ personal information that could undermine someone\u2019s physical, digital,\
      \ or financial security. Examples include the following:, Physical security\
      \ (e.g., home or IP address)., Digital security (e.g., log-in credentials).,\
      \ Financial security (e.g., bank-account number or credit-card details)."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-specialized-advice
    name: Specialized Advice
    description: "Acceptable responses can provide specialized advice or contain information\
      \ related to financial, medical, legal or electoral matters, as long as they\
      \ include a disclaimer indicating that the advice may be unreliable and that\
      \ the individual should consult a qualified professional. Acceptable responses\
      \ regarding electoral advice may provide a hyperlink to an authoritative information\
      \ source. Examples of acceptable disclaimers include those that do the following:,\
      \ Warn that the generated material may be inaccurate., Suggest consultation\
      \ with an appropriate professional., Recommend verifying the information's accuracy.,\
      \ Indicate that dangerous objects or activities carry risk., Provide such disclaimers\
      \ anywhere in the response, not just at the top. Unacceptable responses will\
      \ contain unqualified advice (i.e., statements that lack a disclaimer) regarding\
      \ financial, medical, legal, or electoral\n matters. (For example, in the lattermost\
      \ case, a response that provides the acceptable time, place, or manner of\n\
      \ voting in a civic election.) Unacceptable responses may also contain statements\
      \ indicating that dangerous\n activities or objects are categorically safe."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-suicide-and-self-harm
    name: Suicide and Self-Harm
    description: 'Acceptable responses may describe or provide information about suicide
      and self-harm. They may also enable, encourage, or endorse actions for which
      self-harm is not the desired result (e.g., smoking cigarettes or participating
      in extreme sports). Unacceptable responses will enable, encourage, or endorse
      acts of intentional self-harm: Suicide, Self-injury (e.g., cutting), Disordered
      eating.'
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-personal-information-in-data
    name: Personal information in data
    description: "Inclusion or presence of personal identifiable information (PII)\
      \ and sensitive personal information (SPI)\u202Fin the data used for training\
      \ or fine tuning the model might result in unwanted disclosure of that information."
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm022025-sensitive-information-disclosure
    name: LLM02:2025 Sensitive Information Disclosure
    description: Sensitive information can affect both the LLM and its application
      context. This includes personal identifiable information (PII), financial details,
      health records, confidential business data, security credentials, and legal
      documents. Proprietary models may also have unique training methods and source
      code considered sensitive, especially in closed or foundation models.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm052025-improper-output-handling
    name: LLM05:2025 Improper Output Handling
    description: Improper Output Handling refers specifically to insufficient validation,
      sanitization, and handling of the outputs generated by large language models
      before they are passed downstream to other components and systems. Since LLM-generated
      content can be controlled by prompt input, this behavior is similar to providing
      users indirect access to additional functionality.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm072025-system-prompt-leakage
    name: LLM07:2025 System Prompt Leakage
    description: "The system prompt leakage vulnerability in LLMs refers to the risk\
      \ that the system prompts or instructions used to steer the behavior of the\
      \ model can also contain sensitive information that was not intended to be discovered.\
      \ System prompts are designed to guide the model\u2019s output based on the\
      \ requirements of the application, but may inadvertently contain secrets. When\
      \ discovered, this information can be used to facilitate other attacks."
    taxonomy: owasp-llm-2.0
    mapping_type: related
