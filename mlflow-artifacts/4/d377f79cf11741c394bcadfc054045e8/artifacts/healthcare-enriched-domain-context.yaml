profiles:
- risk_id: ai-risk-taxonomy-medical/pharmaceutical
  risk_name: Medical/Pharmaceutical
  policy_concept: Clinical Diagnosis & Treatment Recommendations
  axes:
  - cco_class_uri: http://purl.obolibrary.org/obo/CHEBI_52217
    cco_class_label: pharmaceutical
    roles:
    - object
    enumerations:
    - class_uri: http://purl.obolibrary.org/obo/CHEBI_23888
      class_label: drug
      source_ontology: OBO
      relevance: high
      provenance: subclass
    - class_uri: http://purl.obolibrary.org/obo/CHEBI_60809
      class_label: adjuvant
      source_ontology: OBO
      relevance: medium
      provenance: subclass
    - class_uri: http://purl.obolibrary.org/obo/CHEBI_33295
      class_label: diagnostic agent
      source_ontology: OBO
      relevance: medium
      provenance: subclass
  - cco_class_uri: http://purl.obolibrary.org/obo/OAE_0000011
    cco_class_label: drug administration
    roles:
    - object
    enumerations:
