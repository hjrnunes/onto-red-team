profiles:
- risk_id: mit-ai-causal-risk-entity-ai
  risk_name: AI decision risk
  policy_concept: Clinical Diagnosis & Treatment Recommendations
  axes:
  - cco_class_uri: http://purl.obolibrary.org/obo/OBI_0302910
    cco_class_label: prediction
    roles:
    - object
    enumerations:
    - class_uri: http://purl.obolibrary.org/obo/OAE_0000101
      class_label: prediction of causal adverse event
      source_ontology: OBO
      relevance: high
      provenance: subclass
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
    cco_class_label: software agent
    roles:
    - agent
    enumerations:
    - class_uri: https://spec.edmcouncil.org/fibo/ontology/LOAN/RealEstateLoans/MortgageOrigination/AutomatedUnderwritingSystem
      class_label: automated underwriting system
      source_ontology: FIBO
      relevance: medium
      provenance: sibling
    - class_uri: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/Agents/AutomatedSystem
      class_label: automated system
      source_ontology: FIBO
      relevance: high
      provenance: sibling
  risk_description: The risk is caused by a decision or action made by an AI system
  risk_concern: ''
  risk_framework: mit-ai-risk-repository-causal
  cross_mappings:
  - id: atlas-copyright-infringement
    name: Copyright infringement
    description: A model might generate content that is similar or identical to existing
      work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-decision-bias
    name: Decision bias
    description: Decision bias occurs when one group is unfairly advantaged over another
      due to decisions of the model. This might be caused by biases in the data and
      also amplified as a result of the model's training.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-exposing-personal-information
    name: Exposing personal information
    description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-hallucination
    name: Hallucination
    description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-harmful-code-generation
    name: Harmful code generation
    description: Models might generate code that causes harm or unintentionally affects
      other systems.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-harmful-output
    name: Harmful output
    description: A model might generate language that leads to physical harm.  The
      language might include overtly violent, covertly dangerous, or otherwise indirectly
      unsafe statements.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-impact-on-cultural-diversity
    name: Impact on cultural diversity
    description: AI systems might overly represent certain cultures that result in
      a homogenization of culture and thoughts.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-impact-on-the-environment
    name: Impact on the environment
    description: AI, and large generative models in particular, might produce increased
      carbon emissions and increase water usage for their training and operation.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-inaccessible-training-data
    name: Inaccessible training data
    description: Without access to the training data, the types of explanations a
      model can provide are limited and more likely to be incorrect.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-incomplete-advice
    name: Incomplete advice
    description: When a model provides advice without having enough information, resulting
      in possible harm if the advice is followed.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-output-bias
    name: Output bias
    description: Generated content might unfairly represent certain groups or individuals.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-personal-information-in-data
    name: Personal information in data
    description: "Inclusion or presence of personal identifiable information (PII)\
      \ and sensitive personal information (SPI)\u202Fin the data used for training\
      \ or fine tuning the model might result in unwanted disclosure of that information."
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-personal-information-in-prompt
    name: Personal information in prompt
    description: Personal information or sensitive personal information that is included
      as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-revealing-confidential-information
    name: Revealing confidential information
    description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-toxic-output
    name: Toxic output
    description: Toxic output occurs when the model produces hateful, abusive, and
      profane (HAP) or obscene content. This also includes behaviors like bullying.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-unexplainable-output
    name: Unexplainable output
    description: Explanations for model output decisions might be difficult, imprecise,
      or not possible to obtain.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-unreliable-source-attribution
    name: Unreliable source attribution
    description: Source attribution is the AI system's ability to describe from what
      training data it generated a portion or all its output. Since current techniques
      are based on approximations, attributions might be incorrect.
    taxonomy: ibm-risk-atlas
    mapping_type: related
- risk_id: credo-risk-017
  risk_name: AI literacy and communication
  policy_concept: Clinical Diagnosis & Treatment Recommendations
  axes:
  - cco_class_uri: https://www.commoncoreontologies.org/ont00000089
    cco_class_label: Skill
    roles:
    - agent
    enumerations:
    - class_uri: https://www.commoncoreontologies.org/ont00000181
      class_label: Language Skill
      source_ontology: CCO
      relevance: high
      provenance: subclass
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/Agent
    cco_class_label: Agent
    roles:
    - agent
    enumerations:
    - class_uri: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/Agents/AutomatedSystem
      class_label: automated system
      source_ontology: FIBO
      relevance: high
      provenance: subclass
    - class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
      class_label: software agent
      source_ontology: Commons
      relevance: high
      provenance: subclass
  risk_description: The AI system's capabilities, limitations, and appropriate use
    cases may be insufficiently understood or communicated within the organization,
    potentially resulting in ineffective implementation or failure to achieve desired
    outcomes.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: mit-ai-risk-subdomain-3.1
    name: False or misleading information
    description: AI systems that inadvertently generate or spread incorrect or deceptive
      information, which can lead to inaccurate beliefs in users and undermine their
      autonomy. Humans that make decisions based on false beliefs can experience physical,
      emotional or material harms
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.4
    name: Lack of transparency or interpretability
    description: Challenges in understanding or explaining the decision-making processes
      of AI systems, which can lead to mistrust, difficulty in enforcing compliance
      standards or holding relevant actors accountable for harms, and the inability
      to identify and correct errors.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm062025-excessive-agency
    name: LLM06:2025 Excessive Agency
    description: An LLM-based system is often granted a degree of agency by its developer
      - the ability to call functions or interface with other systems via extensions
      (sometimes referred to as tools, skills or plugins by different vendors) to
      undertake actions in response to a prompt. The decision over which extension
      to invoke may also be delegated to an LLM 'agent' to dynamically determine based
      on input prompt or LLM output. Agent-based systems will typically make repeated
      calls to an LLM using output from previous invocations to ground and direct
      subsequent invocations. Excessive Agency is the vulnerability that enables damaging
      actions to be performed in response to unexpected, ambiguous or manipulated
      outputs from an LLM, regardless of what is causing the LLM to malfunction.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm092025-misinformation
    name: LLM09:2025 Misinformation
    description: Misinformation from LLMs poses a core vulnerability for applications
      relying on these models. Misinformation occurs when LLMs produce false or misleading
      information that appears credible. This vulnerability can lead to security breaches,
      reputational damage, and legal liability.
    taxonomy: owasp-llm-2.0
    mapping_type: related
