  - cco_class_uri: http://taxonomy-refiner.io/ontologies/cso#ThreatsOfViolence
    cco_class_label: Threats of Violence
    roles:
    - object
    enumerations:
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#DeathThreat
      class_label: Death Threat
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#Intimidation
      class_label: Intimidation
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#Stalking
      class_label: Stalking
      source_ontology: CSO
      relevance: high
      provenance: subclass
  risk_description: The AI system may produce content that incites violence or provides
    instructions for committing crimes.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: nist-dangerous-violent-or-hateful-content
    name: Dangerous, Violent, or Hateful Content
    description: Eased production of and access to violent, inciting, radicalizing,
      or threatening content as well as recommendations to carry out self-harm or
      conduct illegal activities. Includes difficulty controlling public exposure
      to hateful and disparaging or stereotyping content.
    taxonomy: nist-ai-rmf
    mapping_type: close
  - id: ail-violent-crimes
    name: Violent Crimes
    description: 'Acceptable responses may describe or contain information about violent
      crimes. Unacceptable responses will enable, encourage, or endorse the commission
      of violent crimes, such as the following: Unlawful violence toward people (e.g.,
      terrorism, genocide, murder, hate-motivated violent crimes, child abuse, assault,
      battery, or kidnapping), Unlawful violence toward animals (e.g., animal abuse).'
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-hate
    name: Hate
    description: Acceptable responses can demean or dehumanize people on any basis
      other than their sensitive personal characteristics (for example, their profession,
      political affiliation or criminal history). Unacceptable responses will demean
      or dehumanize people on the basis of their sensitive, personal characteristics.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-dangerous-use
    name: Dangerous use
    description: Generative AI models might be used with the sole intention of harming
      people.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-toxic-output
    name: Toxic output
    description: Toxic output occurs when the model produces hateful, abusive, and
      profane (HAP) or obscene content. This also includes behaviors like bullying.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-1.2
    name: Exposure to toxic content
    description: AI exposing users to harmful, abusive, unsafe or inappropriate content.
      May involve AI creating, describing, providing advice, or encouraging action.
      Examples of toxic content include hate-speech, violence, extremism, illegal
      acts, child sexual abuse material, as well as content that violates community
      norms such as profanity, inflammatory political speech, or pornography.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-dangerous-violent-or-hateful-content
    name: Dangerous, Violent, or Hateful Content
    description: Eased production of and access to violent, inciting, radicalizing,
      or threatening content as well as recommendations to carry out self-harm or
      conduct illegal activities. Includes difficulty controlling public exposure
      to hateful and disparaging or stereotyping content.
    taxonomy: nist-ai-rmf
    mapping_type: related
