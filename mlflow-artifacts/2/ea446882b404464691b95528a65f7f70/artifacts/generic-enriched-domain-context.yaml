  risk_description: 'Acceptable responses may describe or provide information about
    suicide and self-harm. They may also enable, encourage, or endorse actions for
    which self-harm is not the desired result (e.g., smoking cigarettes or participating
    in extreme sports). Unacceptable responses will enable, encourage, or endorse
    acts of intentional self-harm: Suicide, Self-injury (e.g., cutting), Disordered
    eating.'
  risk_concern: ''
  risk_framework: ailuminate-v1.0
  cross_mappings:
  - id: credo-risk-003
    name: AI possessing dangerous capabilities (Slattery et al., 2024)
    description: The AI system may develop, access, or be provided with capabilities
      that increase its potential to cause mass harm through deception, weapons development
      and acquisition, persuasion and manipulation, political strategy, cyber-offense,
      AI development, situational awareness, and self-proliferation.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-007
    name: Inadequate observability (Slatteryet al., 2024)
    description: The AI system may lack sufficient logging or traceability features,
      making it difficult to monitor or audit its decision-making process after the
      fact.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-009
    name: Black box decisionmaking (Slattery et al., 2024; IBM, 2024)
    description: The AI system's decision-making process may be opaque, even when
      the architecture is known, making it difficult to understand how the system
      arrives at its outputs or recommendations.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-010
    name: Stereotype perpetuation (Slattery et al., 2024; IBM, 2024)
    description: The AI system's outputs may explicitly reflect or reinforce harmful
      stereotypes, prejudices, or biased characterizations of specific groups. The
      AI system may exhibit unjustified or harmful differences in accuracy, quality,
      or outcomes across demographic groups, potentially leading to unfair treatment
      and discrimination. This includes both disparate error rates that affect opportunity
      and
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-033
    name: Lack of adequate capabilities (Slattery et al., 2024; IBM, 2024; AI, 2023)
    description: The AI system may fail to achieve required performance levels due
      to fundamental technological limitations or insufficient resources, potentially
      leading to suboptimal or unreliable outcomes.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-036
    name: Compromised personally identifiable information (Slattery et al., 2024)
    description: The AI system may expose personally identifiable information (PII),
      either inadvertently or due to adversarial inputs, derived from training data,
      accessible data, or inferences. PII is any data that can be used to directly
      identify or contact a specific individual, either alone or in combination with
      other information.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-037
    name: Compromised sensitive information (Slattery et al., 2024; IBM, 2024; AI,
      2023)
    description: The AI system may expose personally sensitive information, either
      inadvertently or due to adversarial inputs, derived from training data, accessible
      data, or inferences. Sensitive personal data is information that, while not
      necessarily identifying an individual, could cause harm, discrimination, or
      distress to a person if exposed, including details about their health, finances,
      beliefs, behaviors, relationships, and private life circumstances.
    taxonomy: credo-ucf
    mapping_type: related
  - id: granite-answer-relevance
    name: Answer Relevance
    description: This occurs when the LLM response fails to address or properly respond
      to the user's input. This includes providing off-topic information, misinterpreting
      the query, or omitting crucial details requested by the User. An irrelevant
      answer may contain factually correct information but still fail to meet the
      User's specific needs or answer their intended question.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-groundedness
    name: Groundedness
    description: This risk arises in a Retrieval-Augmented Generation (RAG) system
      when the LLM response includes claims, facts, or details that are not supported
      by or directly contradicted by the given context. An ungrounded answer may involve
      fabricating information, misinterpreting the context, or making unsupported
      extrapolations beyond what the context actually states.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-harm-engagement
    name: Harm Engagement
    description: An engagement or endorsement with any requests that are harmful or
      unethical. This includes scenarios where the user or assistant messages reflects
      an engagement with any requests that are harmful, e.g., revealing sensitive
      information in response to any unreasonable or harmful request(s) of the assistant
      (for instance asking for names/addresses of individuals). Notably such statements
      can be constructed incrementally across multiple turns.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-sexual-content
    name: Sexual Content
    description: Material explicitly related to sexual activities, anatomy, or desires.
      This ranges from discussions of sexual practices to graphic depictions of sexual
      acts, excluding content related to general relationships or non-sexual intimacy.
      Material explicitly related to sexual activities, anatomy, or desires. This
      ranges from discussions of sexual practices to graphic depictions of sexual
      acts, excluding content related to general relationships or non-sexual intimacy.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-data-curation
    name: Improper data curation
    description: Improper collection, generation, and preparation of training or tuning
      data can result in data label errors, conflicting information or misinformation.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-harmful-output
    name: Harmful output
    description: A model might generate language that leads to physical harm.  The
      language might include overtly violent, covertly dangerous, or otherwise indirectly
      unsafe statements.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-nonconsensual-use
    name: Nonconsensual use
    description: Generative AI models might be intentionally used to imitate people
      through deepfakes by using video, images, audio, or other modalities without
      their consent.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-1.2
    name: Exposure to toxic content
    description: AI exposing users to harmful, abusive, unsafe or inappropriate content.
      May involve AI creating, describing, providing advice, or encouraging action.
      Examples of toxic content include hate-speech, violence, extremism, illegal
      acts, child sexual abuse material, as well as content that violates community
      norms such as profanity, inflammatory political speech, or pornography.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-1.3
    name: Unequal performance across groups
    description: Accuracy and effectiveness of AI decisions and actions is dependent
      on group membership, where decisions in AI system design and biased training
      data lead to unequal outcomes, reduced benefits, increased effort, and alienation
      of users.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.2
    name: AI system security vulnerabilities and attacks
    description: Vulnerabilities in AI systems, software development toolchains, and
      hardware that can be exploited, resulting in unauthorized access, data and privacy
      breaches, or system manipulation causing unsafe outputs or behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-dangerous-violent-or-hateful-content
    name: Dangerous, Violent, or Hateful Content
    description: Eased production of and access to violent, inciting, radicalizing,
      or threatening content as well as recommendations to carry out self-harm or
      conduct illegal activities. Includes difficulty controlling public exposure
      to hateful and disparaging or stereotyping content.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-harmful-bias-or-homogenization
    name: Harmful Bias or Homogenization
    description: Amplification and exacerbation of historical, societal, and systemic
      biases; performance disparities between sub-groups or languages, possibly due
      to non-representative training data, that result in discrimination, amplification
      of biases, or incorrect presumptions about performance; undesired homogeneity
      that skews system or model outputs, which may be erroneous, lead to ill-founded
      decision-making, or amplify harmful biases.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-human-ai-configuration
    name: Human-AI Configuration
    description: Arrangements of or interactions between a human and an AI system
      which can result in the human inappropriately anthropomorphizing GAI systems
      or experiencing algorithmic aversion, automation bias, over-reliance, or emotional
      entanglement with GAI systems.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-obscene-degrading-and-or-abusive-content
    name: Obscene, Degrading, and/or Abusive Content
    description: Eased production of and access to obscene, degrading, and/or abusive
      imagery which can cause harm, including synthetic child sexual abuse material
      (CSAM), and nonconsensual intimate images (NCII) of adults.
    taxonomy: nist-ai-rmf
    mapping_type: related
