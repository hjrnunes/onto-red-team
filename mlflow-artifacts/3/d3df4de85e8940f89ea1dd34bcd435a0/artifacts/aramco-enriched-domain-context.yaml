    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.2
    name: AI system security vulnerabilities and attacks
    description: Vulnerabilities in AI systems, software development toolchains, and
      hardware that can be exploited, resulting in unauthorized access, data and privacy
      breaches, or system manipulation causing unsafe outputs or behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
- risk_id: llm032025-supply-chain
  risk_name: LLM03:2025 Supply Chain
  policy_concept: Supply Chain & Geopolitical Risks
  axes:
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0010.002
    cco_class_label: Data - ATLAS
    roles:
    - object
    enumerations:
    - class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0010.001
      class_label: AI Software - ATLAS
      source_ontology: D3FEND
      relevance: high
      provenance: sibling
    - class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0010.000
      class_label: Hardware - ATLAS
      source_ontology: D3FEND
      relevance: high
