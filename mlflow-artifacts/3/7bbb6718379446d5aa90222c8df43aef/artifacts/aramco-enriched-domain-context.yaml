  cross_mappings:
  - id: nist-dangerous-violent-or-hateful-content
    name: Dangerous, Violent, or Hateful Content
    description: Eased production of and access to violent, inciting, radicalizing,
      or threatening content as well as recommendations to carry out self-harm or
      conduct illegal activities. Includes difficulty controlling public exposure
      to hateful and disparaging or stereotyping content.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: nist-information-security
    name: Information Security
    description: "Lowered barriers for offensive cyber capabilities, including via\
      \ automated discovery and exploitation of vulnerabilities to ease hacking, malware,\
      \ phishing, offensive cyber operations, or other cyberattacks; increased attack\
      \ surface for targeted cyberattacks, which may compromise a system\u2019s availability\
      \ or the confidentiality or integrity of training data, code, or model weights."
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: shieldgemma-dangerous-content
    name: Dangerous Content
    description: Content that may cause harm to oneself and/or others, including instructions
      for violence, self-harm, or dangerous activities
    taxonomy: shieldgemma-taxonomy
    mapping_type: related
  - id: llm092025-misinformation
    name: LLM09:2025 Misinformation
    description: Misinformation from LLMs poses a core vulnerability for applications
      relying on these models. Misinformation occurs when LLMs produce false or misleading
      information that appears credible. This vulnerability can lead to security breaches,
      reputational damage, and legal liability.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: mit-ai-causal-risk-entity-ai
    name: AI
