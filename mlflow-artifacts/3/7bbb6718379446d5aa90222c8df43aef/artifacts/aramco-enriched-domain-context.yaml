  risk_description: LLM supply chains are susceptible to various vulnerabilities,
    which can affect the integrity of training data, models, and deployment platforms.
    These risks can result in biased outputs, security breaches, or system failures.
    While traditional software vulnerabilities focus on issues like code flaws and
    dependencies, in ML the risks also extend to third-party pre-trained models and
    data.
  risk_concern: ''
  risk_framework: owasp-llm-2.0
  cross_mappings:
  - id: atlas-data-acquisition
    name: Data acquisition restrictions
    description: Laws and other regulations might limit the collection of certain
      types of data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-contamination
    name: Data contamination
    description: Data contamination occurs when incorrect data is used for training.
      For example, data that is not aligned with model's purpose or data that is already
      set aside for other development tasks such as testing and evaluation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-curation
    name: Improper data curation
    description: Improper collection, generation, and preparation of training or tuning
      data can result in data label errors, conflicting information or misinformation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-provenance
    name: Uncertain data provenance
    description: Data provenance refers to the traceability of data (including synthetic
      data), which includes its ownership, origin, transformations, and generation.
      Proving that the data is the same as the original source with correct usage
      terms is difficult without standardized methods for verifying data sources or
      generation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-usage-rights
    name: Data usage rights restrictions
    description: Terms of service, license compliance, or other IP issues may restrict
      the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-lack-of-data-transparency
    name: Lack of data transparency
    description: "Lack of data transparency might be due to insufficient documentation\
      \ of training or tuning dataset details, including synthetic data generation.\_"
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-model-usage-rights
    name: Model usage rights restrictions
    description: Terms of service, licenses, or other rules restrict the use of certain
      models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-untraceable-attribution
    name: Untraceable attribution
    description: The content of the training data used for generating the model's
      output is not accessible.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-improper-retraining
    name: Improper retraining
    description: Using undesirable output (for example, inaccurate, inappropriate,
      and user content) for retraining purposes can result in unexpected model behavior.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-inaccessible-training-data
    name: Inaccessible training data
    description: Without access to the training data, the types of explanations a
      model can provide are limited and more likely to be incorrect.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: credo-risk-047
    name: Insufficient upstream transparency (AI, 2023)
    description: The AI system's upstream providers or components in the value chain
      may lack transparency, potentially increasing uncertainty and risk, and making
      it challenging to assess the system's compliance, performance, or security.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-048
    name: Upstream third-party dependencies (AI, 2023)
    description: The AI system's reliance on third-party developed models, compute,
      or other resources, may potentially limit operational flexibility and introduce
      unforeseen risks or dependencies.
    taxonomy: credo-ucf
    mapping_type: related
