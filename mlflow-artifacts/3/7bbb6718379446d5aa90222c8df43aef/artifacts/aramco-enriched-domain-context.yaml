    - class_uri: http://taxonomy-refiner.io/ontologies/cso#HealthDataExposure
      class_label: Health Data Exposure
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#DirectIdentifierExposure
      class_label: Direct Identifier Exposure
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#EmploymentDataExposure
      class_label: Employment Data Exposure
