      2023)
    description: 'AI system security vulnerabilities: Implementation weaknesses in
      AI system architecture and infrastructure'
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-041
    name: Vulnerability to adversarial attacks (Slattery et al., 2024; IBM, 2024;
      AI, 2023)
    description: The AI system may be vulnerable to adversarial attacks, including
      prompt-based attacks, which may induce the model to behave outside of its intended
      functionality.
    taxonomy: credo-ucf
    mapping_type: related
