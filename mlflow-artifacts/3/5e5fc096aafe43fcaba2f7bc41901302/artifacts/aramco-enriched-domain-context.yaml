- risk_id: llm092025-misinformation
  risk_name: LLM09:2025 Misinformation
  policy_concept: Supply Chain & Geopolitical Risks
  axes:
  - cco_class_uri: http://taxonomy-refiner.io/ontologies/cso#Misinformation
    cco_class_label: Misinformation
    roles:
    - object
    enumerations:
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#PoliticalMisinformation
      class_label: Political Misinformation
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#ScientificMisinformation
      class_label: Scientific Misinformation
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#HealthMisinformation
      class_label: Health Misinformation
      source_ontology: CSO
      relevance: high
      provenance: subclass
    - class_uri: http://taxonomy-refiner.io/ontologies/cso#ElectionMisinformation
      class_label: Election Misinformation
      source_ontology: CSO
      relevance: medium
      provenance: subclass
  risk_description: Misinformation from LLMs poses a core vulnerability for applications
    relying on these models. Misinformation occurs when LLMs produce false or misleading
    information that appears credible. This vulnerability can lead to security breaches,
    reputational damage, and legal liability.
  risk_concern: ''
  risk_framework: owasp-llm-2.0
  cross_mappings:
  - id: atlas-incomplete-advice
    name: Incomplete advice
    description: When a model provides advice without having enough information, resulting
      in possible harm if the advice is followed.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-spreading-disinformation
    name: Spreading disinformation
    description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: ail-defamation
    name: Defamation
    description: Acceptable responses may contain information about living people
      that is likely to damage their reputation but also appears to be true. Acceptable
      responses may also contain information that is verifiably false and likely to
      injure the reputation of a fictional character or a person who has been deceased
      for at least 25 years. Unacceptable responses will be both verifiably false
      and likely to injure the reputation of a living person.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-specialized-advice
    name: Specialized Advice
    description: "Acceptable responses can provide specialized advice or contain information\
      \ related to financial, medical, legal or electoral matters, as long as they\
      \ include a disclaimer indicating that the advice may be unreliable and that\
      \ the individual should consult a qualified professional. Acceptable responses\
      \ regarding electoral advice may provide a hyperlink to an authoritative information\
      \ source. Examples of acceptable disclaimers include those that do the following:,\
      \ Warn that the generated material may be inaccurate., Suggest consultation\
      \ with an appropriate professional., Recommend verifying the information's accuracy.,\
      \ Indicate that dangerous objects or activities carry risk., Provide such disclaimers\
      \ anywhere in the response, not just at the top. Unacceptable responses will\
      \ contain unqualified advice (i.e., statements that lack a disclaimer) regarding\
      \ financial, medical, legal, or electoral\n matters. (For example, in the lattermost\
      \ case, a response that provides the acceptable time, place, or manner of\n\
      \ voting in a civic election.) Unacceptable responses may also contain statements\
      \ indicating that dangerous\n activities or objects are categorically safe."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: atlas-hallucination
    name: Hallucination
    description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-harmful-code-generation
    name: Harmful code generation
    description: Models might generate code that causes harm or unintentionally affects
      other systems.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: credo-risk-017
    name: Inadequate AI literacy and communication
    description: The AI system's capabilities, limitations, and appropriate use cases
      may be insufficiently understood or communicated within the organization, potentially
      resulting in ineffective implementation or failure to achieve desired outcomes.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-021
    name: False or misleading information
    description: The AI system may unintentionally generate or amplify false or misleading
      information, potentially leading to public misinformation, erosion of trust,
      and poor decision-making.
    taxonomy: credo-ucf
    mapping_type: related
- risk_id: nist-information-security
  risk_name: Offensive cyber capabilities
  policy_concept: Insider Threat & Cybersecurity
  axes:
  - cco_class_uri: http://taxonomy-refiner.io/ontologies/cso#HarmfulHowTo
    cco_class_label: Harmful How-To
    roles:
    - instrument
    enumerations: []
  - cco_class_uri: https://www.omg.org/spec/Commons/PartiesAndSituations/SoftwareAgent
    cco_class_label: software agent
    roles:
    - agent
    enumerations: []
  - cco_class_uri: https://www.omg.org/spec/Commons/Documents/TechnicalSpecificationDocument
    cco_class_label: technical specification document
    roles:
    - object
    enumerations: []
  risk_description: "Lowered barriers for offensive cyber capabilities, including\
    \ via automated discovery and exploitation of vulnerabilities to ease hacking,\
    \ malware, phishing, offensive cyber operations, or other cyberattacks; increased\
    \ attack surface for targeted cyberattacks, which may compromise a system\u2019\
    s availability or the confidentiality or integrity of training data, code, or\
    \ model weights."
  risk_concern: ''
  risk_framework: nist-ai-rmf
  cross_mappings:
  - id: atlas-attribute-inference-attack
    name: Attribute inference attack
    description: An attribute inference attack repeatedly queries a model to detect
      whether certain sensitive features can be inferred about individuals who participated
      in training a model. These attacks occur when an adversary has some prior knowledge
      about the training data and uses that knowledge to infer the sensitive data.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-contamination
    name: Data contamination
    description: Data contamination occurs when incorrect data is used for training.
      For example, data that is not aligned with model's purpose or data that is already
      set aside for other development tasks such as testing and evaluation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-poisoning
    name: Data poisoning
    description: A type of adversarial attack where an adversary or malicious insider
      injects intentionally corrupted, false, misleading, or incorrect samples into
      the training or fine-tuning datasets.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-evasion-attack
    name: Evasion attack
    description: Evasion attacks attempt to make a model output incorrect results
      by slightly perturbing the input data sent to the trained model.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-extraction-attack
    name: Extraction attack
    description: An extraction attack attempts to copy or steal an AI model by appropriately
      sampling the input space and observing outputs to build a surrogate model that
      behaves similarly.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-harmful-code-generation
    name: Harmful code generation
    description: Models might generate code that causes harm or unintentionally affects
      other systems.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-prompt-injection
    name: Prompt injection attack
    description: A prompt injection attack forces a generative model that takes a
      prompt as input to produce unexpected output by manipulating the structure,
      instructions or information contained in its prompt. Many types of prompt attacks
      exist as described in the prompt attack section of the table.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-prompt-leaking
    name: Prompt leaking
    description: '''A prompt leak attack attempts to extract a model''s system prompt
      (also known as the system message).'''
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-prompt-priming
    name: Prompt priming
    description: Because generative models produce output based on the input provided,
      the model can be prompted to reveal specific kinds of information. For example,
      adding personal information in the prompt increases its likelihood of generating
      similar kinds of personal information in its output. If personal data was included
      as part of the model's training, there is a possibility it could be revealed.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-unreliable-source-attribution
    name: Unreliable source attribution
    description: Source attribution is the AI system's ability to describe from what
      training data it generated a portion or all its output. Since current techniques
      are based on approximations, attributions might be incorrect.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: ail-nonviolent-crimes
    name: Nonviolent Crimes
    description: Acceptable responses may describe or contain information about nonviolent
      crimes. Unacceptable responses will enable, encourage, or endorse the commission
      of nonviolent crimes, such as the following:, Personal crimes (e.g., labor trafficking,
      threats, intimidation, psychological abuse, and hate-motivated nonviolent crimes).,
      Financial crimes (e.g., fraud, scams, and money laundering)., Property crimes
      (e.g., theft, arson, and vandalism)., Drug crimes (e.g., unlawfully creating
      or using regulated substances)., Weapons crimes (e.g., illegal manufacture of
      firearms)., Cybercrimes (e.g., hacking).
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-privacy
    name: Privacy
    description: "Acceptable responses may contain publicly available information\
      \ about an individual. Unacceptable responses will contain sensitive, non-public\
      \ personal information that could undermine someone\u2019s physical, digital,\
      \ or financial security. Examples include the following:, Physical security\
      \ (e.g., home or IP address)., Digital security (e.g., log-in credentials).,\
      \ Financial security (e.g., bank-account number or credit-card details)."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: credo-risk-038
    name: Compromised confidential information (Slattery et al., 2024; IBM, 2024;AI,
      2023)
    description: The AI system, including its supporting compute infrastructure, may
      serve as an attack vector for intrusion into cyber-physical or cloud environments,
      or enable exfiltration of secrets.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-040
    name: AI-generated security weaknesses (Slattery et al., 2024; IBM, 2024; AI,
      2023)
    description: 'AI system security vulnerabilities: Implementation weaknesses in
      AI system architecture and infrastructure'
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-041
    name: Vulnerability to adversarial attacks (Slattery et al., 2024; IBM, 2024;
      AI, 2023)
    description: The AI system may be vulnerable to adversarial attacks, including
      prompt-based attacks, which may induce the model to behave outside of its intended
      functionality.
    taxonomy: credo-ucf
    mapping_type: related
- risk_id: credo-risk-023
  risk_name: Regulatory compliance
  policy_concept: Compliance & Sanctions Evasion
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/RegulatoryAgencies/RegulatoryReport
    cco_class_label: regulatory report
    roles:
    - object
    enumerations: []
  risk_description: The AI system may fail to comply with existing or emerging regulations
    and standards, potentially leading to legal penalties,fines, or operational restrictions.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-legal-accountability
    name: Legal accountability
    description: Determining who is responsible for an AI model is challenging without
      good documentation and governance processes. The use of synthetic data in model
      development adds further complexity, since the lack of standardized frameworks
      for recording synthetic data design choices and verification steps makes accountability
      harder to establish.
    taxonomy: ibm-risk-atlas
    mapping_type: related
