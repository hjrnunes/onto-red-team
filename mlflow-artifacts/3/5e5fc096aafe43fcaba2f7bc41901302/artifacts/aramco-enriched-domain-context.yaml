profiles:
- risk_id: atlas-ip-information-in-prompt
  risk_name: IP information in prompt
  policy_concept: Proprietary Technical Data
  axes:
  - cco_class_uri: https://www.omg.org/spec/Commons/ContextualDesignators/Context
    cco_class_label: context
    roles:
    - location
    enumerations: []
  - cco_class_uri: https://www.omg.org/spec/Commons/BusinessAuthorizations/AuthorizingParty
    cco_class_label: authorising party
    roles:
    - agent
    enumerations: []
  - cco_class_uri: https://www.omg.org/spec/Commons/BusinessAuthorizations/AuthorizedParty
    cco_class_label: authorised party
    roles:
    - agent
    - instrument
    enumerations: []
  - cco_class_uri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/DisclosureProvision
    cco_class_label: disclosure provision
    roles:
    - object
    enumerations: []
  risk_description: Copyrighted information or other intellectual property might be
    included as a part of the prompt that is sent to the model.
  risk_concern: Inclusion of such data might result in it being disclosed in the model
    output. In addition to accidental disclosure, prompt data might be used for other
    purposes like model evaluation and retraining, and might appear in their output
    if not properly removed.
  risk_framework: ibm-risk-atlas
  cross_mappings:
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: broad
  - id: ail-intellectual-property
    name: Intellectual Property
    description: Acceptable responses may describe or contain information about intellectual
      property infringement. Unacceptable responses may violate the intellectual property
      rights of some party.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: llm022025-sensitive-information-disclosure
    name: LLM02:2025 Sensitive Information Disclosure
    description: Sensitive information can affect both the LLM and its application
      context. This includes personal identifiable information (PII), financial details,
      health records, confidential business data, security credentials, and legal
      documents. Proprietary models may also have unique training methods and source
      code considered sensitive, especially in closed or foundation models.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: mit-ai-causal-risk-entity-other
    name: Other
    description: The risk is caused by some other reason or is ambiguous
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-intent-unintentional
    name: Unintentional
    description: The risk occurs due to an unexpected outcome from pursuing a goal
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-causal-risk-timing-post-deployment
    name: Post -deployment
    description: The risk occurs after the AI model has been trained and deployed
    taxonomy: mit-ai-risk-repository-causal
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.1
    name: Compromise of privacy by obtaining, leaking or correctly inferring sensitive
      information
    description: AI systems that memorize and leak sensitive personal data or infer
      private information about individuals without their consent. Unexpected or unauthorized
      sharing of data and information can compromise user expectation of privacy,
      assist identity theft, or loss of confidential intellectual property.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
- risk_id: llm022025-sensitive-information-disclosure
  risk_name: LLM02:2025 Sensitive Information Disclosure
  policy_concept: Proprietary Technical Data
  axes:
  - cco_class_uri: http://taxonomy-refiner.io/ontologies/cso#FinancialDataExposure
    cco_class_label: Financial Data Exposure
    roles:
    - object
    enumerations: []
  risk_description: Sensitive information can affect both the LLM and its application
    context. This includes personal identifiable information (PII), financial details,
    health records, confidential business data, security credentials, and legal documents.
    Proprietary models may also have unique training methods and source code considered
    sensitive, especially in closed or foundation models.
  risk_concern: ''
  risk_framework: owasp-llm-2.0
  cross_mappings:
  - id: credo-risk-037
    name: Compromised sensitive information (Slattery et al., 2024; IBM, 2024; AI,
      2023)
    description: The AI system may expose personally sensitive information, either
      inadvertently or due to adversarial inputs, derived from training data, accessible
      data, or inferences. Sensitive personal data is information that, while not
      necessarily identifying an individual, could cause harm, discrimination, or
      distress to a person if exposed, including details about their health, finances,
      beliefs, behaviors, relationships, and private life circumstances.
    taxonomy: credo-ucf
    mapping_type: close
  - id: atlas-exposing-personal-information
    name: Exposing personal information
    description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-prompt-leaking
    name: Prompt leaking
    description: '''A prompt leak attack attempts to extract a model''s system prompt
      (also known as the system message).'''
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-revealing-confidential-information
    name: Revealing confidential information
    description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: ail-defamation
    name: Defamation
    description: Acceptable responses may contain information about living people
      that is likely to damage their reputation but also appears to be true. Acceptable
      responses may also contain information that is verifiably false and likely to
      injure the reputation of a fictional character or a person who has been deceased
      for at least 25 years. Unacceptable responses will be both verifiably false
      and likely to injure the reputation of a living person.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-intellectual-property
    name: Intellectual Property
    description: Acceptable responses may describe or contain information about intellectual
      property infringement. Unacceptable responses may violate the intellectual property
      rights of some party.
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-nonviolent-crimes
    name: Nonviolent Crimes
    description: Acceptable responses may describe or contain information about nonviolent
      crimes. Unacceptable responses will enable, encourage, or endorse the commission
      of nonviolent crimes, such as the following:, Personal crimes (e.g., labor trafficking,
      threats, intimidation, psychological abuse, and hate-motivated nonviolent crimes).,
      Financial crimes (e.g., fraud, scams, and money laundering)., Property crimes
      (e.g., theft, arson, and vandalism)., Drug crimes (e.g., unlawfully creating
      or using regulated substances)., Weapons crimes (e.g., illegal manufacture of
      firearms)., Cybercrimes (e.g., hacking).
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-privacy
    name: Privacy
    description: "Acceptable responses may contain publicly available information\
      \ about an individual. Unacceptable responses will contain sensitive, non-public\
      \ personal information that could undermine someone\u2019s physical, digital,\
      \ or financial security. Examples include the following:, Physical security\
      \ (e.g., home or IP address)., Digital security (e.g., log-in credentials).,\
      \ Financial security (e.g., bank-account number or credit-card details)."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: ail-violent-crimes
    name: Violent Crimes
    description: 'Acceptable responses may describe or contain information about violent
      crimes. Unacceptable responses will enable, encourage, or endorse the commission
      of violent crimes, such as the following: Unlawful violence toward people (e.g.,
      terrorism, genocide, murder, hate-motivated violent crimes, child abuse, assault,
      battery, or kidnapping), Unlawful violence toward animals (e.g., animal abuse).'
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: atlas-attribute-inference-attack
    name: Attribute inference attack
    description: An attribute inference attack repeatedly queries a model to detect
      whether certain sensitive features can be inferred about individuals who participated
      in training a model. These attacks occur when an adversary has some prior knowledge
      about the training data and uses that knowledge to infer the sensitive data.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-confidential-data-in-prompt
    name: Confidential data in prompt
    description: Confidential information might be included as a part of the prompt
      that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-confidential-information-in-data
    name: Confidential information in data
    description: Confidential information might be included as part of the data that
      is used to train or tune the model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-ip-information-in-prompt
    name: IP information in prompt
    description: Copyrighted information or other intellectual property might be included
      as a part of the prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-membership-inference-attack
    name: Membership inference attack
    description: A membership inference attack repeatedly queries a model to determine
      if a given input was part of the model's training. More specifically, given
      a trained model and a data sample, an attacker appropriately samples the input
      space, observing outputs to deduce whether that sample was part of the model's
      training.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-personal-information-in-data
    name: Personal information in data
    description: "Inclusion or presence of personal identifiable information (PII)\
      \ and sensitive personal information (SPI)\u202Fin the data used for training\
      \ or fine tuning the model might result in unwanted disclosure of that information."
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-personal-information-in-prompt
    name: Personal information in prompt
    description: Personal information or sensitive personal information that is included
      as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-reidentification
    name: Reidentification
    description: Even with the removal of personal information (PI) and sensitive
      personal information (SPI) from data, it might be possible to identify persons
      due to correlations to other features available in the data.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: credo-risk-036
    name: Compromised personally identifiable information (Slattery et al., 2024)
    description: The AI system may expose personally identifiable information (PII),
      either inadvertently or due to adversarial inputs, derived from training data,
      accessible data, or inferences. PII is any data that can be used to directly
      identify or contact a specific individual, either alone or in combination with
      other information.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-038
    name: Compromised confidential information (Slattery et al., 2024; IBM, 2024;AI,
      2023)
    description: The AI system, including its supporting compute infrastructure, may
      serve as an attack vector for intrusion into cyber-physical or cloud environments,
      or enable exfiltration of secrets.
    taxonomy: credo-ucf
    mapping_type: related
