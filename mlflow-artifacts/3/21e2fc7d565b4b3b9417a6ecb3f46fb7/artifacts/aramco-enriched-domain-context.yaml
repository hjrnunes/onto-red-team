- risk_id: credo-risk-041
  risk_name: Adversarial Attacks
  policy_concept: Operational Security & Critical Infrastructure
  axes:
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0065
    cco_class_label: LLM Prompt Crafting
    roles:
    - agent
    enumerations: []
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0031
    cco_class_label: Erode AI Model Integrity
    roles:
    - object
    enumerations: []
  risk_description: The AI system may be vulnerable to adversarial attacks, including
    prompt-based attacks, which may induce the model to behave outside of its intended
    functionality.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-jailbreak
    name: Jailbreaking
    description: Deliberate circumvention of AI systems' built-in safeguards or ethical
      guidelines. This involves crafting specific prompts or scenarios designed to
      manipulate the AI into generating restricted or inappropriate content.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-evasion-attack
    name: Evasion attack
    description: Evasion attacks attempt to make a model output incorrect results
      by slightly perturbing the input data sent to the trained model.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.2
    name: AI system security vulnerabilities and attacks
    description: Vulnerabilities in AI systems, software development toolchains, and
      hardware that can be exploited, resulting in unauthorized access, data and privacy
      breaches, or system manipulation causing unsafe outputs or behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.3
    name: Lack of capability or robustness
    description: AI systems that fail to perform reliably or effectively under varying
      conditions, exposing them to errors and failures that can have significant consequences,
      especially in critical applications or areas that require moral reasoning.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-information-security
    name: Information Security
    description: "Lowered barriers for offensive cyber capabilities, including via\
      \ automated discovery and exploitation of vulnerabilities to ease hacking, malware,\
      \ phishing, offensive cyber operations, or other cyberattacks; increased attack\
      \ surface for targeted cyberattacks, which may compromise a system\u2019s availability\
      \ or the confidentiality or integrity of training data, code, or model weights."
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm042025-data-and-model-poisoning
    name: 'LLM04: Data and Model Poisoning'
    description: Data poisoning occurs when pre-training, fine-tuning, or embedding
      data is manipulated to introduce vulnerabilities, backdoors, or biases. This
      manipulation can compromise model security, performance, or ethical behavior,
      leading to harmful outputs or impaired capabilities. Common risks include degraded
      model performance, biased or toxic content, and exploitation of downstream systems.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm072025-system-prompt-leakage
    name: LLM07:2025 System Prompt Leakage
    description: "The system prompt leakage vulnerability in LLMs refers to the risk\
      \ that the system prompts or instructions used to steer the behavior of the\
      \ model can also contain sensitive information that was not intended to be discovered.\
      \ System prompts are designed to guide the model\u2019s output based on the\
      \ requirements of the application, but may inadvertently contain secrets. When\
      \ discovered, this information can be used to facilitate other attacks."
    taxonomy: owasp-llm-2.0
    mapping_type: related
- risk_id: llm032025-supply-chain
  risk_name: Supply Chain Risk
  policy_concept: Supply Chain & Geopolitical Risks
  axes:
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0010.002
    cco_class_label: Data
    roles:
    - object
    enumerations: []
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#EX-0012.13
    cco_class_label: Poison AI/ML Training Data
    roles:
    - agent
    enumerations: []
  risk_description: LLM supply chains are susceptible to various vulnerabilities,
    which can affect the integrity of training data, models, and deployment platforms.
    These risks can result in biased outputs, security breaches, or system failures.
    While traditional software vulnerabilities focus on issues like code flaws and
    dependencies, in ML the risks also extend to third-party pre-trained models and
    data.
  risk_concern: ''
  risk_framework: owasp-llm-2.0
  cross_mappings:
  - id: atlas-data-acquisition
    name: Data acquisition restrictions
    description: Laws and other regulations might limit the collection of certain
      types of data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-contamination
    name: Data contamination
    description: Data contamination occurs when incorrect data is used for training.
      For example, data that is not aligned with model's purpose or data that is already
      set aside for other development tasks such as testing and evaluation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-curation
    name: Improper data curation
    description: Improper collection, generation, and preparation of training or tuning
      data can result in data label errors, conflicting information or misinformation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-provenance
    name: Uncertain data provenance
    description: Data provenance refers to the traceability of data (including synthetic
      data), which includes its ownership, origin, transformations, and generation.
      Proving that the data is the same as the original source with correct usage
      terms is difficult without standardized methods for verifying data sources or
      generation.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-data-usage-rights
    name: Data usage rights restrictions
    description: Terms of service, license compliance, or other IP issues may restrict
      the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-lack-of-data-transparency
    name: Lack of data transparency
    description: "Lack of data transparency might be due to insufficient documentation\
      \ of training or tuning dataset details, including synthetic data generation.\_"
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-model-usage-rights
    name: Model usage rights restrictions
    description: Terms of service, licenses, or other rules restrict the use of certain
      models.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-untraceable-attribution
    name: Untraceable attribution
    description: The content of the training data used for generating the model's
      output is not accessible.
    taxonomy: ibm-risk-atlas
    mapping_type: broad
  - id: atlas-improper-retraining
    name: Improper retraining
    description: Using undesirable output (for example, inaccurate, inappropriate,
      and user content) for retraining purposes can result in unexpected model behavior.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: atlas-inaccessible-training-data
    name: Inaccessible training data
    description: Without access to the training data, the types of explanations a
      model can provide are limited and more likely to be incorrect.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: credo-risk-047
    name: Insufficient upstream transparency (AI, 2023)
    description: The AI system's upstream providers or components in the value chain
      may lack transparency, potentially increasing uncertainty and risk, and making
      it challenging to assess the system's compliance, performance, or security.
    taxonomy: credo-ucf
    mapping_type: related
  - id: credo-risk-048
    name: Upstream third-party dependencies (AI, 2023)
    description: The AI system's reliance on third-party developed models, compute,
      or other resources, may potentially limit operational flexibility and introduce
      unforeseen risks or dependencies.
    taxonomy: credo-ucf
    mapping_type: related
