  risk_description: The AI system, including its supporting compute infrastructure,
    may serve as an attack vector for intrusion into cyber-physical or cloud environments,
    or enable exfiltration of secrets.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: atlas-revealing-confidential-information
    name: Revealing confidential information
    description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    mapping_type: close
  - id: ail-privacy
    name: Privacy
    description: "Acceptable responses may contain publicly available information\
      \ about an individual. Unacceptable responses will contain sensitive, non-public\
      \ personal information that could undermine someone\u2019s physical, digital,\
      \ or financial security. Examples include the following:, Physical security\
      \ (e.g., home or IP address)., Digital security (e.g., log-in credentials).,\
      \ Financial security (e.g., bank-account number or credit-card details)."
    taxonomy: ailuminate-v1.0
    mapping_type: related
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.1
    name: Compromise of privacy by obtaining, leaking or correctly inferring sensitive
      information
    description: AI systems that memorize and leak sensitive personal data or infer
      private information about individuals without their consent. Unexpected or unauthorized
      sharing of data and information can compromise user expectation of privacy,
      assist identity theft, or loss of confidential intellectual property.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.2
    name: AI system security vulnerabilities and attacks
    description: Vulnerabilities in AI systems, software development toolchains, and
      hardware that can be exploited, resulting in unauthorized access, data and privacy
      breaches, or system manipulation causing unsafe outputs or behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-information-security
    name: Information Security
    description: "Lowered barriers for offensive cyber capabilities, including via\
      \ automated discovery and exploitation of vulnerabilities to ease hacking, malware,\
      \ phishing, offensive cyber operations, or other cyberattacks; increased attack\
      \ surface for targeted cyberattacks, which may compromise a system\u2019s availability\
      \ or the confidentiality or integrity of training data, code, or model weights."
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm022025-sensitive-information-disclosure
    name: LLM02:2025 Sensitive Information Disclosure
    description: Sensitive information can affect both the LLM and its application
      context. This includes personal identifiable information (PII), financial details,
      health records, confidential business data, security credentials, and legal
      documents. Proprietary models may also have unique training methods and source
      code considered sensitive, especially in closed or foundation models.
    taxonomy: owasp-llm-2.0
    mapping_type: related
  - id: llm072025-system-prompt-leakage
    name: LLM07:2025 System Prompt Leakage
    description: "The system prompt leakage vulnerability in LLMs refers to the risk\
      \ that the system prompts or instructions used to steer the behavior of the\
      \ model can also contain sensitive information that was not intended to be discovered.\
      \ System prompts are designed to guide the model\u2019s output based on the\
      \ requirements of the application, but may inadvertently contain secrets. When\
      \ discovered, this information can be used to facilitate other attacks."
    taxonomy: owasp-llm-2.0
    mapping_type: related
