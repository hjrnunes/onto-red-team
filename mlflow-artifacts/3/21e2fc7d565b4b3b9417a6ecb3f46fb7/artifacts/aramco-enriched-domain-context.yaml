  risk_description: The AI system may fail to comply with existing or emerging regulations
    and standards, potentially leading to legal penalties,fines, or operational restrictions.
  risk_concern: ''
  risk_framework: Credo
  cross_mappings:
  - id: granite-guardian-harm
    name: Harm
    description: 'Content considered universally harmful. This is our general category,
      which should encompass a variety of risks including those not specifically addressed
      by the following categories: Social Bias, Profanity, Sexual Content, Unethical
      Behavior, Violence, Jailbreaking, Groundedness, Answer Relevance, Context Relevance.'
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-legal-accountability
    name: Legal accountability
    description: Determining who is responsible for an AI model is challenging without
      good documentation and governance processes. The use of synthetic data in model
      development adds further complexity, since the lack of standardized frameworks
      for recording synthetic data design choices and verification steps makes accountability
      harder to establish.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.4
    name: Competitive dynamics
    description: "AI developers or state-like actors competing in an AI \u2018race\u2019\
      \ by rapidly developing, deploying, and applying AI systems to maximize strategic\
      \ or economic advantage, increasing the risk they release unsafe and error-prone\
      \ systems."
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.5
    name: Governance failure
    description: Inadequate regulatory frameworks and oversight mechanisms failing
      to keep pace with AI development, leading to ineffective governance and the
      inability to manage AI risks appropriately.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-data-privacy
    name: Data Privacy
    description: Impacts due to leakage and unauthorized use, disclosure, or de-anonymization
      of biometric, health, location, or other personally identifiable information
      or sensitive data.
    taxonomy: nist-ai-rmf
    mapping_type: related
