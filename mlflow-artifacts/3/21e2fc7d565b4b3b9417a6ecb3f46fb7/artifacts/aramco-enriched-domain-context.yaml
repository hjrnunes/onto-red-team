      source_ontology: D3FEND
      relevance: high
      provenance: sibling
    - class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#CWE-1295
      class_label: Debug Messages Revealing Unnecessary Information
      source_ontology: D3FEND
      relevance: medium
