  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0024
    cco_class_label: Exfiltration via AI Inference API - ATLAS
    roles:
    - instrument
    enumerations:
    - class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#AML.T0024.002
      class_label: Extract AI Model - ATLAS
