- risk_id: llm022025-sensitive-information-disclosure
  risk_name: Sensitive Info
  policy_concept: Proprietary Technical Data
  axes:
  - cco_class_uri: http://d3fend.mitre.org/ontologies/d3fend.owl#CWE-213
    cco_class_label: Exposure of Sensitive Information Due to Incompatible Policies
