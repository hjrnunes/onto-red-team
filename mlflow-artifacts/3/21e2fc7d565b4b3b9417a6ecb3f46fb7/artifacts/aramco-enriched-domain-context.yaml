  - id: llm032025-supply-chain
    name: LLM03:2025 Supply Chain
    description: LLM supply chains are susceptible to various vulnerabilities, which
      can affect the integrity of training data, models, and deployment platforms.
      These risks can result in biased outputs, security breaches, or system failures.
      While traditional software vulnerabilities focus on issues like code flaws and
      dependencies, in ML the risks also extend to third-party pre-trained models
      and data.
    taxonomy: owasp-llm-2.0
    mapping_type: related
