    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: granite-unethical-behavior
    name: Unethical Behavior
    description: Actions that violate moral or professional standards, focusing on
      exploitation for personal gain or disregard for others' well-being. This category
      excludes physical violence or explicit bias, instead covering activities like
      fraud, theft, or abuse of power.
    taxonomy: ibm-granite-guardian
    mapping_type: related
  - id: atlas-harmful-output
    name: Harmful output
    description: A model might generate language that leads to physical harm.  The
      language might include overtly violent, covertly dangerous, or otherwise indirectly
      unsafe statements.
    taxonomy: ibm-risk-atlas
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.1
    name: Compromise of privacy by obtaining, leaking or correctly inferring sensitive
      information
    description: AI systems that memorize and leak sensitive personal data or infer
      private information about individuals without their consent. Unexpected or unauthorized
      sharing of data and information can compromise user expectation of privacy,
      assist identity theft, or loss of confidential intellectual property.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-2.2
    name: AI system security vulnerabilities and attacks
    description: Vulnerabilities in AI systems, software development toolchains, and
      hardware that can be exploited, resulting in unauthorized access, data and privacy
      breaches, or system manipulation causing unsafe outputs or behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-4.1
    name: Disinformation, surveillance, and influence at scale
    description: Using AI systems to conduct large-scale disinformation campaigns,
      malicious surveillance, or targeted and sophisticated automated censorship and
      propaganda, with the aim to manipulate political processes, public opinion and
      behavior.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-4.2
    name: Cyberattacks, weapon development or use, and mass harm
    description: Using AI systems to develop cyber weapons (e.g., coding cheaper,
      more effective malware), develop new or enhance existing weapons (e.g., Lethal
      Autonomous Weapons or CBRNE), or use weapons to cause mass harm.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-4.3
    name: Fraud, scams, and targeted manipulation
    description: Using AI systems to gain a personal advantage over others such as
      through cheating, fraud, scams, blackmail or targeted manipulation of beliefs
      or behavior. Examples include AI-facilitated plagiarism for research or education,
      impersonating a trusted or fake individual for illegitimate financial benefit,
      or creating humiliating or sexual imagery.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-5.1
    name: Overreliance and unsafe use
    description: Users anthropomorphizing, trusting, or relying on AI systems, leading
      to emotional or material dependence and inappropriate relationships with or
      expectations of AI systems. Trust can be exploited by malicious actors (e.g.,
      to harvest personal information or enable manipulation), or result in harm from
      inappropriate use of AI in critical situations (e.g., medical emergency). Overreliance
      on AI systems can compromise autonomy and weaken social ties.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-5.2
    name: Loss of human agency and autonomy
    description: Humans delegating key decisions to AI systems, or AI systems making
      decisions that diminish human control and autonomy, potentially leading to humans
      feeling disempowered, losing the ability to shape a fulfilling life trajectory
      or becoming cognitively enfeebled.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.5
    name: Governance failure
    description: Inadequate regulatory frameworks and oversight mechanisms failing
      to keep pace with AI development, leading to ineffective governance and the
      inability to manage AI risks appropriately.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-6.6
    name: Environmental harm
    description: The development and operation of AI systems causing environmental
      harm, such as through energy consumption of data centers, or material and carbon
      footprints associated with AI hardware.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.1
    name: AI pursuing its own goals in conflict with human goals or values
    description: AI systems acting in conflict with human goals or values, especially
      the goals of designers or users, or ethical standards. These misaligned behaviors
      may be introduced by humans during design and development, such as through reward
      hacking and goal misgeneralisation, or may result from AI using dangerous capabilities
      such as manipulation, deception, situational awareness to seek power, self-proliferate,
      or achieve other goals.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: mit-ai-risk-subdomain-7.2
    name: AI possessing dangerous capabilities
    description: AI systems that develop, access, or are provided with capabilities
      that increase their potential to cause mass harm through deception, weapons
      development and acquisition, persuasion and manipulation, political strategy,
      cyber-offense, AI development, situational awareness, and self-proliferation.
      These capabilities may cause mass harm due to malicious human actors, misaligned
      AI systems, or failure in the AI system.
    taxonomy: mit-ai-risk-repository
    mapping_type: related
  - id: nist-dangerous-violent-or-hateful-content
    name: Dangerous, Violent, or Hateful Content
    description: Eased production of and access to violent, inciting, radicalizing,
      or threatening content as well as recommendations to carry out self-harm or
      conduct illegal activities. Includes difficulty controlling public exposure
      to hateful and disparaging or stereotyping content.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-information-integrity
    name: Information Integrity
    description: Lowered barrier to entry to generate and support the exchange and
      consumption of content which may not distinguish fact from opinion or fiction
      or acknowledge uncertainties, or could be leveraged for large-scale dis- and
      mis-information campaigns.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-information-security
    name: Information Security
    description: "Lowered barriers for offensive cyber capabilities, including via\
      \ automated discovery and exploitation of vulnerabilities to ease hacking, malware,\
      \ phishing, offensive cyber operations, or other cyberattacks; increased attack\
      \ surface for targeted cyberattacks, which may compromise a system\u2019s availability\
      \ or the confidentiality or integrity of training data, code, or model weights."
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: nist-intellectual-property
    name: Intellectual Property
    description: Eased production or replication of alleged copyrighted, trademarked,
      or licensed content without authorization (possibly in situations which do not
      fall under fair use); eased exposure of trade secrets; or plagiarism or illegal
      replication.
    taxonomy: nist-ai-rmf
    mapping_type: related
  - id: llm022025-sensitive-information-disclosure
    name: LLM02:2025 Sensitive Information Disclosure
    description: Sensitive information can affect both the LLM and its application
      context. This includes personal identifiable information (PII), financial details,
      health records, confidential business data, security credentials, and legal
      documents. Proprietary models may also have unique training methods and source
      code considered sensitive, especially in closed or foundation models.
    taxonomy: owasp-llm-2.0
    mapping_type: related
