volumes:
  pgdata-mlflow:

services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - pgdata-mlflow:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow} -d ${POSTGRES_DB:-mlflow}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION:-latest}
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "${MLFLOW_PORT:-5000}"
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary
        mlflow server \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --serve-artifacts \
          --artifacts-destination /mlflow/artifacts \
          --default-artifact-root mlflow-artifacts:/ \
          --host "$$MLFLOW_HOST" \
          --port "$$MLFLOW_PORT" \
          --allowed-hosts "*" \
          --cors-allowed-origins "https://mlflow.taxonomy-refiner.orb.local"
    volumes:
      - ./mlflow-artifacts:/mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:${MLFLOW_PORT:-5000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT:-5000}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  default:
    name: mlflow-network
