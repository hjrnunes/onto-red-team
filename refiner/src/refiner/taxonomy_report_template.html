<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomy Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .tip {
            position: relative;
            cursor: help;
        }
        .tip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            font-size: 0.75rem;
            white-space: nowrap;
            border-radius: 0.25rem;
            z-index: 10;
            margin-bottom: 0.25rem;
        }
        .tip-icon {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            text-align: center;
            line-height: 1rem;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.1);
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="reportApp()" x-cloak>
    <header class="bg-gray-900 text-white px-6 py-4 shadow-lg">
        <h1 class="text-2xl font-bold">Taxonomy Report</h1>
        <p class="text-gray-400 text-sm mt-1" x-show="data.taxonomies.length > 0" x-text="data.taxonomies[0].name"></p>
    </header>

    <div class="max-w-screen-xl mx-auto p-6 space-y-6">
        <!-- Overview Cards -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <div class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Taxonomies</div>
                <div class="text-3xl font-bold text-gray-900 mt-2" x-text="data.taxonomies.length"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <div class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Groups</div>
                <div class="text-3xl font-bold text-gray-900 mt-2" x-text="data.groups.length"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <div class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Entries</div>
                <div class="text-3xl font-bold text-gray-900 mt-2" x-text="data.entries.length"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                <div class="text-sm font-semibold text-gray-500 uppercase tracking-wide">CURIE Prefixes</div>
                <div class="text-3xl font-bold text-gray-900 mt-2" x-text="Object.keys(data.curie_map || {}).length"></div>
            </div>
        </section>

        <!-- CURIE Map -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5" x-data="{expanded: false}">
            <div class="flex items-center justify-between cursor-pointer" @click="expanded = !expanded">
                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">CURIE Map</h2>
                <svg class="w-5 h-5 text-gray-400 transition-transform" :class="{'rotate-180': expanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>
            <div x-show="expanded" x-collapse>
                <div class="mt-4 overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase">Prefix</th>
                                <th class="px-3 py-2 text-left text-xs font-semibold text-gray-600 uppercase">URI</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                            <template x-for="[prefix, uri] in Object.entries(data.curie_map || {})" :key="prefix">
                                <tr>
                                    <td class="px-3 py-2 font-mono text-indigo-600" x-text="prefix"></td>
                                    <td class="px-3 py-2 font-mono text-gray-600 text-xs" x-text="uri"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Groups -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Groups</h2>
            <div class="space-y-4">
                <template x-for="taxonomy in data.taxonomies" :key="taxonomy.id">
                    <div>
                        <h3 class="font-semibold text-gray-700 mb-2" x-text="taxonomy.name"></h3>
                        <div class="space-y-2 ml-4">
                            <template x-for="group in data.groups.filter(g => g.isDefinedByTaxonomy === taxonomy.id)" :key="group.id">
                                <div class="flex items-center gap-2">
                                    <span class="text-gray-900" x-text="group.name"></span>
                                    <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-700" x-text="group.type"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Entries -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Entries</h2>
            <div class="space-y-2">
                <template x-for="entry in data.entries" :key="entry.id">
                    <div class="border border-gray-200 rounded-lg overflow-hidden" x-data="{expanded: false}">
                        <div class="flex items-center justify-between p-3 cursor-pointer hover:bg-gray-50" @click="expanded = !expanded">
                            <div class="flex items-center gap-2 flex-1">
                                <span class="font-semibold text-gray-900" x-text="entry.name"></span>
                                <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-green-100 text-green-700" x-text="entry.type"></span>
                                <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-gray-100 text-gray-700" x-text="entry.isDefinedByTaxonomy"></span>
                            </div>
                            <svg class="w-5 h-5 text-gray-400 transition-transform flex-shrink-0" :class="{'rotate-180': expanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                        <div x-show="expanded" x-collapse>
                            <div class="px-3 pb-3 space-y-4 bg-gray-50">
                                <!-- Cross-mappings -->
                                <div x-show="entry.broad_mappings?.length || entry.related_mappings?.length || entry.exact_mappings?.length || entry.narrow_mappings?.length">
                                    <h4 class="text-xs font-semibold text-gray-600 uppercase mb-2">Cross-mappings</h4>
                                    <div class="space-y-1.5">
                                        <div x-show="entry.broad_mappings?.length">
                                            <span class="text-xs font-medium text-gray-500">Broad:</span>
                                            <div class="flex flex-wrap gap-1 mt-1">
                                                <template x-for="mapping in entry.broad_mappings" :key="mapping">
                                                    <span class="px-2 py-0.5 text-xs font-mono rounded bg-blue-100 text-blue-700" x-text="mapping"></span>
                                                </template>
                                            </div>
                                        </div>
                                        <div x-show="entry.related_mappings?.length">
                                            <span class="text-xs font-medium text-gray-500">Related:</span>
                                            <div class="flex flex-wrap gap-1 mt-1">
                                                <template x-for="mapping in entry.related_mappings" :key="mapping">
                                                    <span class="px-2 py-0.5 text-xs font-mono rounded bg-purple-100 text-purple-700" x-text="mapping"></span>
                                                </template>
                                            </div>
                                        </div>
                                        <div x-show="entry.exact_mappings?.length">
                                            <span class="text-xs font-medium text-gray-500">Exact:</span>
                                            <div class="flex flex-wrap gap-1 mt-1">
                                                <template x-for="mapping in entry.exact_mappings" :key="mapping">
                                                    <span class="px-2 py-0.5 text-xs font-mono rounded bg-green-100 text-green-700" x-text="mapping"></span>
                                                </template>
                                            </div>
                                        </div>
                                        <div x-show="entry.narrow_mappings?.length">
                                            <span class="text-xs font-medium text-gray-500">Narrow:</span>
                                            <div class="flex flex-wrap gap-1 mt-1">
                                                <template x-for="mapping in entry.narrow_mappings" :key="mapping">
                                                    <span class="px-2 py-0.5 text-xs font-mono rounded bg-amber-100 text-amber-700" x-text="mapping"></span>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Domain Context Summary -->
                                <div x-show="entry.domain_context_summary">
                                    <h4 class="text-xs font-semibold text-gray-600 uppercase mb-2">Domain Context</h4>
                                    <div class="flex flex-wrap gap-2 mb-3">
                                        <span class="px-2 py-0.5 text-xs font-medium rounded bg-indigo-100 text-indigo-700">
                                            <span x-text="entry.domain_context_summary?.axis_count"></span> axes
                                        </span>
                                        <span class="px-2 py-0.5 text-xs font-medium rounded bg-indigo-100 text-indigo-700">
                                            <span x-text="entry.domain_context_summary?.enumeration_count"></span> enumerations
                                        </span>
                                        <template x-for="ontology in (entry.domain_context_summary?.source_ontologies || [])" :key="ontology">
                                            <span class="px-2 py-0.5 text-xs font-medium rounded bg-gray-200 text-gray-700" x-text="ontology"></span>
                                        </template>
                                    </div>

                                    <!-- Per-axis details -->
                                    <div x-show="entry.domain_context_summary?.axes?.length" class="space-y-2">
                                        <template x-for="axis in (entry.domain_context_summary?.axes || [])" :key="axis.uri">
                                            <div class="bg-white rounded border border-gray-200 p-2">
                                                <div class="font-medium text-sm text-gray-900" x-text="axis.class"></div>
                                                <div class="text-xs font-mono text-gray-500 mt-0.5" x-text="axis.uri"></div>
                                                <div class="flex flex-wrap gap-1 mt-2">
                                                    <template x-for="role in (axis.roles || [])" :key="role">
                                                        <span class="px-1.5 py-0.5 text-xs font-medium rounded bg-teal-100 text-teal-700" x-text="role"></span>
                                                    </template>
                                                    <span class="px-1.5 py-0.5 text-xs font-medium rounded bg-gray-100 text-gray-600">
                                                        <span x-text="axis.enumeration_count"></span> enumerations
                                                    </span>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </div>

    <script>
    const DATA = __REPORT_DATA__;
    function reportApp() { return { data: DATA }; }
    </script>
</body>
</html>
