<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataset Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .tip {
      position: relative;
      cursor: help;
    }
    .tip .tip-icon {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: #6b7280;
      color: white;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1rem;
    }
    .tip:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem;
      background: #1f2937;
      color: white;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      white-space: nowrap;
      z-index: 10;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="reportApp()" x-cloak>
  <header class="bg-gray-900 text-white px-6 py-4 shadow-lg">
    <h1 class="text-2xl font-bold">Dataset Report</h1>
    <p class="text-gray-400 text-sm mt-1" x-text="data.summary.total_rows + ' generation prompts'"></p>
  </header>

  <div class="max-w-screen-xl mx-auto p-6 space-y-6">
    <!-- Overview Cards -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <div class="text-2xl font-bold text-gray-900" x-text="data.summary.total_rows"></div>
        <div class="text-sm text-gray-500 mt-1">Total Rows</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <div class="text-2xl font-bold text-gray-900" x-text="Object.keys(data.summary.policies).length"></div>
        <div class="text-sm text-gray-500 mt-1">Unique Policies</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <div class="text-2xl font-bold text-gray-900" x-text="Object.keys(data.summary.risks).length"></div>
        <div class="text-sm text-gray-500 mt-1">Unique Risks</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <div class="text-2xl font-bold text-gray-900" x-text="Object.keys(data.summary.techniques).length"></div>
        <div class="text-sm text-gray-500 mt-1">Unique Techniques</div>
      </div>
    </section>

    <!-- Distribution Cards -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Policies Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Policies</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.policies).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700" x-text="key"></span>
                <span class="font-semibold text-indigo-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-indigo-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.policies)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Techniques Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Techniques</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.techniques).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700" x-text="key"></span>
                <span class="font-semibold text-blue-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.techniques)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Risks Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Risks</h2>
        <div class="space-y-2 max-h-64 overflow-y-auto">
          <template x-for="[key, count] in Object.entries(data.summary.risks).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700 truncate" x-text="key"></span>
                <span class="font-semibold text-amber-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-amber-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.risks)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Frameworks Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Frameworks</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.frameworks).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700" x-text="key"></span>
                <span class="font-semibold text-green-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-green-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.frameworks)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Ontologies Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Ontologies</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.ontologies).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700" x-text="key"></span>
                <span class="font-semibold text-purple-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-purple-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.ontologies)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Roles Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Roles</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.roles).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700" x-text="key"></span>
                <span class="font-semibold text-pink-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-pink-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.roles)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Relevance Distribution -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Relevance</h2>
        <div class="space-y-2">
          <template x-for="[key, count] in Object.entries(data.summary.relevance).sort((a, b) => b[1] - a[1])" :key="key">
            <div>
              <div class="flex justify-between text-sm mb-1">
                <span class="text-gray-700 capitalize" x-text="key"></span>
                <span class="font-semibold text-teal-600" x-text="count"></span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-teal-500 h-2 rounded-full" :style="'width: ' + (count / Math.max(1, ...Object.values(data.summary.relevance)) * 100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- Prompt Browser -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3">Prompt Browser</h2>

      <!-- Filters -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Policy</label>
          <select x-model="filterPolicy" @change="page = 1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All Policies</option>
            <template x-for="policy in Object.keys(data.summary.policies).sort()" :key="policy">
              <option :value="policy" x-text="policy"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Technique</label>
          <select x-model="filterTechnique" @change="page = 1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">All Techniques</option>
            <template x-for="technique in Object.keys(data.summary.techniques).sort()" :key="technique">
              <option :value="technique" x-text="technique"></option>
            </template>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Search Prompt</label>
          <input type="text" x-model="filterText" @input="page = 1" placeholder="Search in prompts..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <!-- Results Info -->
      <div class="text-sm text-gray-600 mb-3">
        Showing <span x-text="Math.min((page - 1) * perPage + 1, filteredRows.length)"></span>-<span x-text="Math.min(page * perPage, filteredRows.length)"></span> of <span x-text="filteredRows.length"></span>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Policy Concept</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Risk ID</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Technique</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sampled Axes</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Generation Prompt</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <template x-for="(row, idx) in pagedRows" :key="idx">
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 text-sm text-gray-900" x-text="row.policy_concept"></td>
                <td class="px-4 py-3 text-sm font-mono text-gray-600" x-text="row.risk_id"></td>
                <td class="px-4 py-3">
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800" x-text="row.technique"></span>
                </td>
                <td class="px-4 py-3">
                  <div class="flex flex-wrap gap-1">
                    <template x-for="(axis, aidx) in row.sampled_axes || []" :key="aidx">
                      <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-700" x-text="axis.sampled_label"></span>
                    </template>
                  </div>
                </td>
                <td class="px-4 py-3 text-sm text-gray-700">
                  <div class="relative">
                    <div x-show="expandedRow !== idx" @click="expandedRow = idx" class="cursor-pointer hover:text-indigo-600">
                      <span x-text="promptPreview(row)"></span>
                      <span class="text-indigo-600 ml-1" x-show="promptPreview(row).endsWith('...')">more</span>
                    </div>
                    <div x-show="expandedRow === idx" @click="expandedRow = null" class="cursor-pointer">
                      <div class="space-y-2 max-h-96 overflow-y-auto p-3 bg-gray-50 rounded border border-gray-200">
                        <template x-for="(msg, midx) in row.generation_prompt || []" :key="midx">
                          <div>
                            <div class="text-xs font-semibold text-gray-500 uppercase mb-1" x-text="msg.role"></div>
                            <div class="text-sm text-gray-800 whitespace-pre-wrap" x-text="msg.content"></div>
                          </div>
                        </template>
                      </div>
                      <span class="text-indigo-600 ml-1">less</span>
                    </div>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between mt-4">
        <button
          @click="page--"
          :disabled="page === 1"
          :class="page === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700">
          Previous
        </button>
        <span class="text-sm text-gray-600">
          Page <span x-text="page"></span> of <span x-text="totalPages"></span>
        </span>
        <button
          @click="page++"
          :disabled="page >= totalPages"
          :class="page >= totalPages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-100'"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700">
          Next
        </button>
      </div>
    </section>
  </div>

  <script>
const DATA = __REPORT_DATA__;
function reportApp() {
  return {
    data: DATA,
    filterPolicy: '',
    filterTechnique: '',
    filterText: '',
    page: 1,
    perPage: 25,
    expandedRow: null,

    get filteredRows() {
      return this.data.rows.filter(r => {
        if (this.filterPolicy && r.policy_concept !== this.filterPolicy) return false;
        if (this.filterTechnique && r.technique !== this.filterTechnique) return false;
        if (this.filterText) {
          const prompt = JSON.stringify(r.generation_prompt || '').toLowerCase();
          if (!prompt.includes(this.filterText.toLowerCase())) return false;
        }
        return true;
      });
    },

    get pagedRows() {
      const start = (this.page - 1) * this.perPage;
      return this.filteredRows.slice(start, start + this.perPage);
    },

    get totalPages() {
      return Math.ceil(this.filteredRows.length / this.perPage);
    },

    promptPreview(row) {
      const msgs = row.generation_prompt || [];
      const last = msgs[msgs.length - 1];
      if (!last) return '';
      const text = last.content || '';
      return text.length > 120 ? text.substring(0, 120) + '...' : text;
    }
  };
}
  </script>
</body>
</html>
