[project]
name = "refiner"
version = "0.1.0"
description = "LLM pipeline for transforming client policies into risk taxonomies with domain context"
requires-python = ">=3.11"
dependencies = [
    "instructor>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "ontoquery",
    "nexus-mcp",
]

[project.scripts]
refiner = "refiner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refiner"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
tracking = ["mlflow>=2.14"]

[tool.uv.sources]
ontoquery = { path = "../ontoquery", editable = true }
nexus-mcp = { path = "../nexus-mcp", editable = true }
